    walk: '<circle cx="13" cy="4.6" r="1.7"/><path d="M11 20.5l1.6-5.2-2.3-2.1.9-4.4 3.1 2 2.3 1M9.3 12.2 8 15.4M14.4 15.3l1.9 5.2"/>',
    users: '<circle cx="9" cy="8.2" r="3.2"/><path d="M3.6 19.5a5.4 5.4 0 0 1 10.8 0"/><path d="M16.2 5.4a3.2 3.2 0 0 1 0 5.9M17.6 14.6a5.4 5.4 0 0 1 2.8 4.9"/>',
    trash: '<path d="M4.5 6.5h15M10 6.5V4.8h4v1.7M6.8 6.5l.9 13.2h8.6l.9-13.2"/>',
    pencil: '<path d="M4.5 19.5h4L20 8a2.1 2.1 0 0 0-3-3L5.5 16.5v3Z"/>',
    external: '<path d="M14.5 4h5.5v5.5M20 4l-8.5 8.5"/><path d="M18 14.5V19a1.6 1.6 0 0 1-1.6 1.6H5.6A1.6 1.6 0 0 1 4 19V8.2a1.6 1.6 0 0 1 1.6-1.6H10"/>',
    bed: '<path d="M3.5 19v-8.5M3.5 13.5h17V19M20.5 15.2v-1.7a2.6 2.6 0 0 0-2.6-2.6H10.5v3"/><circle cx="7.2" cy="9.7" r="1.9"/>',
    plane: '<path d="M21 3.2 2.8 10.6l7 2.6 2.6 7L21 3.2Z"/><path d="M9.8 13.2 21 3.2"/>',
    train: '<rect x="5.5" y="3.5" width="13" height="12.2" rx="3.2"/><path d="M5.5 10.4h13M8.8 20l1.7-2.6M15.2 20l-1.7-2.6"/><circle cx="9.3" cy="13" r=".9"/><circle cx="14.7" cy="13" r=".9"/>',
    pin: '<path d="M12 21s6.8-5.9 6.8-11a6.8 6.8 0 1 0-13.6 0C5.2 15.1 12 21 12 21Z"/><circle cx="12" cy="10" r="2.4"/>',
    calendar: '<rect x="3.5" y="5.2" width="17" height="15.3" rx="2.6"/><path d="M3.5 10.2h17M8 3v4.2M16 3v4.2"/>',
    check: '<path d="m5 12.6 4.6 4.6L19 7.4"/>',
    search: '<circle cx="10.8" cy="10.8" r="6.4"/><path d="m15.5 15.5 4.7 4.7"/>',
    back: '<path d="M14.8 5.5 8 12l6.8 6.5"/>',
    refresh: '<path d="M20.2 12a8.2 8.2 0 1 1-2.6-6"/><path d="M20.2 3.8v5h-5"/>',
    up: '<path d="m6.5 14.5 5.5-5.5 5.5 5.5"/>',
    down: '<path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>',
    globe: '<circle cx="12" cy="12" r="8.2"/><path d="M3.8 12h16.4"/><path d="M12 3.8c2.1 2.3 3.2 5.1 3.2 8.2S14.1 17.9 12 20.2c-2.1-2.3-3.2-5.1-3.2-8.2S9.9 6.1 12 3.8Z"/>',
    camera: '<path d="M3.5 8.5h3.2l1.4-2.2h7.8l1.4 2.2h3.2v10.2a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V8.5Z"/><circle cx="12" cy="13.4" r="3.4"/>',
    bookmark: '<path d="M6.5 3.8h11v16.4L12 16.1l-5.5 4.1V3.8Z"/>',
    flame: '<path d="M12 21c3.5 0 6-2.3 6-5.5 0-3.6-3.3-5.2-3.3-8.7 0 0-2.3 1-2.9 3.5-1-1-1.2-3-1.2-3S6 8.6 6 15.5C6 18.7 8.5 21 12 21Z"/>',
    note: '<path d="M4.8 4.5h14.4v10.6l-4.2 4.4H4.8V4.5Z"/><path d="M19.2 15.1h-4.2v4.4"/>',
    // categories
    sight: '<path d="M4 20.5h16M6.2 20.5V10.2l5.8-3.7 5.8 3.7v10.3M10.3 20.5v-4.8h3.4v4.8"/>',
    food: '<path d="M7 3.2v6.4a2.1 2.1 0 0 0 4.2 0V3.2M9.1 9.6v11.2"/><path d="M17.2 3.2c-1.6 1.3-2.4 3.2-2.4 5.3 0 1.9.9 3.2 2.4 3.7v8.6"/>',
    coffee: '<path d="M4.2 8.4h12.6v5.9a4.2 4.2 0 0 1-4.2 4.2H8.4a4.2 4.2 0 0 1-4.2-4.2V8.4Z"/><path d="M16.8 9.9h1.6a2.5 2.5 0 0 1 0 5h-1.6"/><path d="M7.4 5.6V3.5M10.5 5.6V3.5M13.6 5.6V3.5"/>',
    matcha: '<path d="M4.6 19.4C4.6 11.2 10.2 5.8 19.8 4.6c1 9.4-4.4 15-12.6 15a3.6 3.6 0 0 1-2.6-.2Z"/><path d="M8.8 15.2c2.4-3 5.4-5 8.8-6"/>',
    culture: '<path d="M3.5 20.5h17M5.4 20.5V10.4M9.6 20.5V10.4M14.4 20.5V10.4M18.6 20.5V10.4M3.2 10.4h17.6L12 4.2 3.2 10.4Z"/>',
    shopping: '<path d="M5.6 7.8h12.8l1.1 12.7H4.5L5.6 7.8Z"/><path d="M9 9.9V6.6a3 3 0 0 1 6 0v3.3"/>',
    nature: '<path d="M12 20.8v-4.6"/><path d="M12 16.2a5.4 5.4 0 0 0 1.4-10.6 4 4 0 0 0-6.8 1.7 4.2 4.2 0 0 0 .6 8.9H12Z"/>',
    nightlife: '<path d="M4 5h16l-8 8.2L4 5Z"/><path d="M12 13.2v7.3M8.6 20.5h6.8"/>',
    custom: '<path d="M12 21s6.8-5.9 6.8-11a6.8 6.8 0 1 0-13.6 0C5.2 15.1 12 21 12 21Z"/><circle cx="12" cy="10" r="2.4"/>',
  };
  // ic("plus")            -> plain icon
  // ic("pin", "sm")       -> smaller
  // ic("bed", "", "#c00") -> forced colour
  function ic(name, cls, color) {
    const body = ICONS[name] || ICONS.pin;
    return '<svg class="ic ' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true"' +
      (color ? ' style="color:' + color + '"' : "") + ">" + body + "</svg>";
  }
  const CAT_ICON = { sight: "sight", food: "food", coffee: "coffee", matcha: "matcha", culture: "culture",
    shopping: "shopping", nature: "nature", nightlife: "nightlife", custom: "custom" };
  // a place's category icon, tinted with that category's colour
  const catIc = (p, cls) => ic(CAT_ICON[(catOf(p) === CATEGORIES.custom ? "custom" : p.c)] || "custom", cls, catOf(p).color);

  // ------------------------------------------------------------------ state
  // An in-memory projection of the database for this session. Reads come from
  // here; every write goes back to the server through save() / Repo.
  const store = {
    status: BOOT.status,          // placeId -> "want" | "planned" | "visited"
    notes: BOOT.notes,            // placeId -> string
    trips: BOOT.trips,
    base: BOOT.prefs.basePlaceId || "the-bund",
    prefs: BOOT.prefs || {},
    me: BOOT.me,
  };

  // ---- persistence -----------------------------------------------------------
  // save() is called from ~30 mutation sites. Rather than make each one async,
  // it marks the open trip dirty and flushes shortly after; a burst of edits
  // becomes one atomic plan write. Errors surface as a hint, never silently.
  let saveTimer = null, lastPushed = {}, saving = false;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 350);
  }
  async function flush() {
    if (saving) { save(); return; }          // a flush is already in the air
    saving = true;
    try {
      for (const t of store.trips) {
        const snap = JSON.stringify(PlannerAPI.toPlanDoc(t)) + "|" + t.name + t.start + t.end;
        if (lastPushed[t.id] === snap) continue;
        const doc = await Repo.saveTrip(t);
        // the server re-derives where each day was and whether it counts as
        // travel; take its answer rather than guessing locally
        if (doc) {
          t.areasByDay = (doc.days || []).reduce((a, d) => { a[d.date] = d.areaIds; return a; }, {});
          t.travelDays = (doc.days || []).reduce((a, d) => { if (d.travel) a[d.date] = true; return a; }, {});
          t.commutesByDay = (doc.days || []).reduce((a, d) => { a[d.date] = d.commuteIds; return a; }, {});
          (doc.stays || []).forEach((s, n) => { if (t.segments[n]) t.segments[n].stayId = s.id; });
        }
        lastPushed[t.id] = snap;
      }
    } catch (e) {
      showHint("Couldn't save: " + e.message);
      console.error("[save]", e);
    } finally { saving = false; }
  }
  // A pending edit must not die with the window.
  window.addEventListener("beforeunload", () => { if (saveTimer) { clearTimeout(saveTimer); flush(); } });

  async function savePrefs(patch) {
    store.prefs = Object.assign({}, store.prefs, patch);
    try { await Repo.savePrefs(store.prefs); } catch (e) { console.warn("[prefs]", e.message); }
  }

  // ------------------------------------------------------------------ geography
  // Three levels: country -> area (a city, province or any region) -> district.
  // Seeded areas live in cities.js; anything you add yourself lives in the store,
  // so a trip can reach a new province or a new country without touching the data files.
  // COUNTRIES / CITIES came from the database at boot; anything created during
  // the session is written server-side first, then merged into these maps.
  const allCountries = () => COUNTRIES;
  const allAreas = () => CITIES;
  const areaOf = id => allAreas()[id] || null;
  const areaName = id => (areaOf(id) || {}).name || id || "";
  const countryOf = areaId => (areaOf(areaId) || {}).country || "cn";
  const countryName = id => (allCountries()[id] || {}).name || id || "";
  const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);

  // "31.2, 121.4" or any Google Maps URL you paste in
  function parseLatLng(str) {
    if (!str) return null;
    const s2 = String(str);
    let m = s2.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)
         || s2.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
         || s2.match(/[?&](?:q|query|ll|center)=(-?\d+(?:\.\d+)?)(?:,|%2C)(-?\d+(?:\.\d+)?)/i)
         || s2.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,/]\s*(-?\d{1,3}(?:\.\d+)?)/);
    if (!m) return null;
    const lat = +m[1], lng = +m[2];
    if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat, lng };
  }

  const activeCats = new Set(Object.keys(CATEGORIES));
  const ui = { search: "", district: "", status: "", listOnly: false, city: "shanghai", country: "" };

  // ------------------------------------------------------------------ map
  const map = L.map("map", { zoomControl: true }).setView([31.235, 121.49], 12);
  // Offline-first basemap: serve bundled tiles from ./tiles, fall back to
  // CARTO online for any tile we didn't pre-download (deeper zoom / other areas).
  const ONLINE_TILES = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png";
  const SUBS = ["a", "b", "c", "d"];
  const base = L.tileLayer("tiles/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19,
  });
  base.on("tileerror", (e) => {
    const t = e.tile, c = e.coords;
    if (!t || t._fellBack || !c) return;
    t._fellBack = true; // one online retry per tile (avoids loops when fully offline)
    const s = SUBS[(c.x + c.y) % SUBS.length];
    t.src = ONLINE_TILES.replace("{s}", s).replace("{z}", c.z).replace("{x}", c.x).replace("{y}", c.y);
  });
  base.addTo(map);
  L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);

  // ---- district boundaries (polygons served from the database) ----
  const ADCODE2KEY = {};
  for (const [k, d] of Object.entries(DISTRICTS)) ADCODE2KEY[d.adcode] = k;

  const districtLayers = {};   // key -> L.geoJSON layer
  const districtLabels = {};   // key -> label marker
  const districtGeom   = {};   // key -> geojson feature (for point-in-polygon)
  const zoneGroup  = L.layerGroup().addTo(map);
  const labelGroup = L.layerGroup().addTo(map);
  const hotelLayer = L.layerGroup().addTo(map);   // distinct hotel markers for where you stay

  const hotelIcon = () => L.divIcon({
    className: "", iconSize: [34, 34], iconAnchor: [17, 30],
    html: `<div class="hotel-pin">${ic("bed", "lg")}</div>`,
  });
  const hotelMarkers = {};
  // `date` scopes the pins to the stays that touch that day; omit it to show the whole trip
  function drawHotels(t, date) {
    hotelLayer.clearLayers();
    for (const k in hotelMarkers) delete hotelMarkers[k];
    if (!t) return;
    const only = date ? new Set(segsForDate(t, date).map(x => x.i)) : null;
    t.segments.forEach((s, si) => {
      if (only && !only.has(si)) return;
      const ho = s.hotel; if (!ho || typeof ho.lat !== "number") return;
      const m = L.marker([ho.lat, ho.lng], { icon: hotelIcon(), zIndexOffset: 1000 }).addTo(hotelLayer);
      hotelMarkers[si] = m;
      m.bindPopup(`<div class="pop"><h3>${ic("bed")}${(ho.name || "").replace(/</g, "&lt;")}</h3>
        <div class="pcn">${(ho.area || "").replace(/</g, "&lt;")}</div>
        <div class="distline">${ic("calendar", "sm")}Stay ${fmtDay(s.start)} → ${fmtDay(s.end)}</div>
        ${ho.link ? `<div class="links"><a href="${ho.link}" target="_blank" rel="noopener">${ic("map", "sm")}Open in Maps</a></div>` : ""}</div>`, { minWidth: 200 });
      m.bindTooltip(`${(ho.name || "")}`, { direction: "top", offset: [0, -26] });
    });
  }

  function styleFor(key, hover) {
    const c = DISTRICTS[key].color;
    const active = ui.district === key;
    return {
      color: c, weight: (hover || active) ? 3 : 1.3,
      opacity: (hover || active) ? 1 : .65,
      fillColor: c, fillOpacity: active ? .28 : (hover ? .22 : .09),
    };
  }
  const zonesOn = () => document.getElementById("zonesToggle").checked;

  // Rough visual centre of a polygon — good enough to hang a label on.
  function centroidOf(f) {
    const rings = f.geometry.type === "MultiPolygon"
      ? f.geometry.coordinates.map(p => p[0]) : [f.geometry.coordinates[0]];
    let best = null, bestLen = -1;
    for (const r of rings) if (r.length > bestLen) { bestLen = r.length; best = r; }
    let x = 0, y = 0;
    for (const [lng, lat] of best) { x += lng; y += lat; }
    return [x / best.length, y / best.length];
  }

  SH_DISTRICTS_GEO.features.forEach(f => {
    // the server names the district explicitly; adcode is only a fallback
    const key = f.properties.id || ADCODE2KEY[f.properties.adcode];
    if (!key || !DISTRICTS[key]) return;
    districtGeom[key] = f;
    const layer = L.geoJSON(f, { style: styleFor(key, false) });
    layer.on("mouseover", () => { if (zonesOn() && ui.district !== key) layer.setStyle(styleFor(key, true)); });
    layer.on("mouseout",  () => { if (zonesOn()) layer.setStyle(styleFor(key, false)); });
    layer.on("click", (e) => { if (addMode) addPinAt(e.latlng); else selectDistrict(key); });
    districtLayers[key] = layer;

    const d = DISTRICTS[key];
    const c = f.properties.centroid || f.properties.center || centroidOf(f); // [lng, lat]
    districtLabels[key] = L.marker([c[1], c[0]], {
      interactive: false,
      icon: L.divIcon({ className: "", html:
        `<div class="zone-label" style="color:${d.color}">${d.name}<span>${d.cn}</span></div>` }),
    });
  });

  function drawZones() {
    zoneGroup.clearLayers(); labelGroup.clearLayers();
    if (!zonesOn()) return;
    for (const [key, l] of Object.entries(districtLayers)) {
      if (ui.city && DISTRICTS[key].city !== ui.city) continue;
      l.setStyle(styleFor(key, false)); zoneGroup.addLayer(l);
    }
    for (const [key, l] of Object.entries(districtLabels)) {
      if (ui.city && DISTRICTS[key].city !== ui.city) continue;
      labelGroup.addLayer(l);
    }
  }

  // ---- point-in-polygon: assign each place to the district that contains it ----
  function pipRing(pt, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function inFeature(lng, lat, f) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) {
      if (pipRing([lng, lat], poly[0])) {
        let hole = false;
        for (let k = 1; k < poly.length; k++) if (pipRing([lng, lat], poly[k])) hole = true;
        if (!hole) return true;
      }
    }
    return false;
  }
  function districtOfPoint(lat, lng) {
    for (const key in districtGeom) if (inFeature(lng, lat, districtGeom[key])) return key;
    return null;
  }
  function assignDistrict(p) {
    const k = districtOfPoint(p.lat, p.lng);
    if (k) { p.d = k; p.city = DISTRICTS[k].city; }        // inside a mapped district: trust the polygon
    else {                                                  // elsewhere: keep whatever area was chosen
      if (!DISTRICTS[p.d]) p.d = "_other";
      if (!p.city || !areaOf(p.city)) p.city = p.city || "shanghai";
    }
    p.country = countryOf(p.city);
    return p;
  }

  function selectDistrict(key) {
    const sel = document.getElementById("districtFilter");
    sel.value = (ui.district === key) ? "" : key;
    ui.district = sel.value;
    drawZones(); renderList();
    if (ui.district && districtLayers[key]) map.fitBounds(districtLayers[key].getBounds(), { padding: [30, 30] });
  }

  // ------------------------------------------------------------------ markers
  const markers = {};   // id -> L.marker
  // trip map-scoping + day highlight state (set by the Trips module)
  let scopeTrip = null;        // when set, map is scoped to this trip's places
  // what the map shows while a trip is open:
  //   day       — only the day currently focused in the plan
  //   trip      — everything scheduled in this trip            (default)
  //   unvisited — the trip, plus places I haven't been to yet
  //   all       — everything
  let scopeMode = "day";
  let dayFocusIds = new Set(); // ids highlighted for the selected day
  let dayFocusOrder = {};      // id -> order number within the day
  function tripIdSet(t) { const s = new Set(); Object.values(t.plan || {}).forEach(a => a.forEach(id => s.add(id))); return s; }
  const allPlaces = () => PLACES;
  const indexPlaces = () => { const ix = {}; PLACES.forEach(p => ix[p.id] = p); return ix; };
  function catOf(p) { return CATEGORIES[p.c] || CATEGORIES.custom; }
  function placeById(id) { return allPlaces().find(p => p.id === id); }

  // ---- distance guide ----
  function haversine(a, b) {
    const R = 6371, toR = x => x * Math.PI / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  const kmText = km => km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(km < 10 ? 1 : 0) + " km";
  function basePlace() { return placeById(store.base) || PLACES[0]; }
  function distInfo(p) {
    const base = basePlace();
    if (!base || base.id === p.id) return null;
    const km = haversine(base, p);
    const sameCity = (base.city || "shanghai") === (p.city || "shanghai");
    let est;
    if (!sameCity) est = "intercity · high-speed rail";
    else if (km < 1.3) est = "~" + Math.max(1, Math.round(km / 5 * 60)) + " min walk";
    else if (km < 4) est = "~" + Math.round(km / 5 * 60) + " min walk / ~" + Math.max(5, Math.round(km / 22 * 60)) + " min by car";
    else est = "~" + Math.round(km / 22 * 60) + " min by car";
    return { km, sameCity, est, base };
  }

  // pick up to a few images (real geosearched ones if available, else representative)
  function imagesFor(p) {
    if (p.images && p.images.length) return p.images.slice(0, 4);
    const C = (typeof IMG_CAT !== "undefined") ? IMG_CAT : {};
    const cc = p.sub || p.c;
    const extra = { coffee: [C.bakery, C.matcha], matcha: [C.tea, C.coffee], food: [C.shengjian, C.noodle],
      sight: [C.street, C.skyline], culture: [C.temple, C.museum], nature: [C.watertown, C.garden],
      shopping: [C.street], nightlife: [C.cocktail] }[cc] || [];
    return [...new Set([imageFor(p), ...extra].filter(Boolean))].slice(0, 3);
  }

  // pick a representative image: explicit > landmark photo > keyword > category
  function imageFor(p) {
    if (p.img) return p.img;
    if (p.images && p.images.length) return p.images[0];
    const C = (typeof IMG_CAT !== "undefined") ? IMG_CAT : {};
    if (p.sub && C[p.sub]) return C[p.sub];
    const n = (p.name + " " + (p.cn || "")).toLowerCase();
    if (/matcha|抹茶/.test(n)) return C.matcha;
    if (/coffee|caf[eé]|arabica|manner|roast|brew|espresso|%|咖啡/.test(n)) return C.coffee;
    if (/bakery|baker|bread|sourdough|croissant|mills|pastr/.test(n)) return C.bakery;
    if (/shengjian|生煎|fry-dumpling|fried dumpling/.test(n)) return C.shengjian;
    if (/xiaolong|xiao long|tang bao|小笼|汤包|dumpling/.test(n)) return C.dumpling;
    if (/crayfish|seafood|寿宁|lobster/.test(n)) return C.seafood;
    if (/noodle|面/.test(n)) return C.noodle;
    if (/water town|zhujiajiao|qibao|panlong|古镇|水乡/.test(n)) return C.watertown;
    if (/temple|寺/.test(n)) return C.temple;
    if (/bar|speakeasy|cocktail|penicillin|diosa|club/.test(n)) return C.cocktail;
    if (/museum|gallery|fotografiska|library|art\b|美术|博物|图书/.test(n)) return C.museum;
    if (/garden|park|botanic|zoo|园|公园/.test(n)) return C.garden;
    const byCat = { food: C.dumpling, coffee: C.coffee, matcha: C.matcha, sight: C.skyline,
      culture: C.museum, nature: C.garden, shopping: C.street, nightlife: C.cocktail, custom: C.skyline };
    return byCat[p.c] || C.skyline || "";
  }
  const q = s => encodeURIComponent(s);
  const cityName = p => areaName(p.city) || "Shanghai";
  function linksHtml(p) {
    const term = (p.name + " " + (p.cn || "") + " " + cityName(p)).trim();
    const parts = [];
    if (p.link) parts.push(`<a href="${p.link}" target="_blank" rel="noopener">${ic("globe", "sm")}Website</a>`);
    parts.push(`<a href="https://www.google.com/maps/search/?api=1&query=${q(term)}" target="_blank" rel="noopener">${ic("map", "sm")}Map</a>`);
    parts.push(`<a href="https://www.google.com/search?tbm=isch&q=${q(term)}" target="_blank" rel="noopener">${ic("camera", "sm")}Photos</a>`);
    parts.push(`<a href="https://www.xiaohongshu.com/search_result?keyword=${q(p.cn || p.name)}" target="_blank" rel="noopener">${ic("bookmark", "sm")}RED</a>`);
    return `<div class="links">${parts.join("")}</div>`;
  }
  function tooltipHtml(p) {
    const imgs = imagesFor(p);
    const cls = imgs.length === 1 ? "solo" : imgs.length === 2 ? "duo" : "";
    const d = distInfo(p);
    return `<div><div class="gal ${cls}">${imgs.map(u => `<img src="${u}" loading="lazy" alt="">`).join("")}</div>
      <div class="ttname">${catIc(p)}<div>${p.name}<small>${p.cn || ""}</small></div></div>
      ${d ? `<div class="ttdist">${ic("pin", "sm")}${kmText(d.km)} from ${d.base.name} · ${d.est}</div>` : ""}</div>`;
  }
  function distHtml(p) {
    if (store.base === p.id)
      return `<div class="distline"><span class="base-tag">${ic("target", "sm")}Your base</span> distances are measured from here</div>`;
    const d = distInfo(p);
    return d ? `<div class="distline">${ic("pin", "sm")}<b>${kmText(d.km)}</b> from ${d.base.name} · ${d.est}</div>` : "";
  }

  function markerIcon(p) {
    const color = catOf(p).color;
    const st = store.status[p.id];
    const focus = dayFocusIds.has(p.id);
    const ring = focus ? "#ffb703" : st === "want" ? "#d99e0b" : st === "planned" ? "#2b7fd6" : st === "visited" ? "#2ca24a" : "#ffffff";
    const size = focus ? 28 : st ? 20 : 16;
    const num = focus ? `<span class="mnum">${dayFocusOrder[p.id] || ""}</span>` : "";
    return L.divIcon({
      className: "",
      html: `<div class="marker-ring${focus ? " focus" : ""}" style="width:${size}px;height:${size}px;background:${color};
        box-shadow:0 0 0 ${focus ? 4 : 3}px ${ring},0 1px 5px rgba(0,0,0,.5)">${num}</div>`,
      iconSize: [size, size], iconAnchor: [size/2, size/2],
    });
  }

  function popupHtml(p) {
    const cat = catOf(p);
    const st = store.status[p.id] || "";
    const note = store.notes[p.id] || "";
    const btn = (v, label) =>
      `<button data-st="${v}" class="${st===v?'sel '+v:''}">${label}</button>`;
    const dName = DISTRICTS[p.d] ? DISTRICTS[p.d].name : (p.d || "");
    return `<div class="pop">
      <div class="strip">${imagesFor(p).map(u => `<img src="${u}" loading="lazy" alt="" onerror="this.remove()">`).join("")}</div>
      <h3>${catIc(p)}${p.name}${p.hot?' <span class="hot-badge">'+ic('flame','sm')+'Trending</span>':''}</h3>
      <div class="pcn">${p.cn || ""} · ${cat.label}${dName?(" · "+dName):""}${p.city?(" · "+esc(areaName(p.city))):""}</div>
      ${distHtml(p)}
      ${p.desc?`<p>${p.desc}</p>`:""}
      ${p.src?`<div class="srcline">found via ${p.src}</div>`:""}
      ${linksHtml(p)}
      <div class="statusbtns">
        ${btn("want","Want")}${btn("planned","Plan")}${btn("visited","Been")}
      </div>
      <textarea placeholder="Your notes…">${note.replace(/</g,"&lt;")}</textarea>
      <button class="extbtn">${ic("search", "sm")}Details &amp; live web</button>
      <button class="wishbtn">${ic("layers", "sm")}Add as an alternative</button>
      ${store.base===p.id?"":`<button class="setbase">Set as base for distances</button>`}
      ${p.custom?`<button class="del">Delete this pin</button>`:""}
    </div>`;
  }

  function bindPopup(p) {
    const m = markers[p.id];
    m.bindPopup(() => popupHtml(p), { minWidth: 240, maxWidth: 260 });
    m.bindTooltip(() => tooltipHtml(p), { direction: "top", offset: [0, -6], opacity: 1, className: "place-tt", sticky: false });
    // opening a marker also drives the mini browser (unless it was closed by hand)
    m.on("popupopen", (e) => { wirePopup(e.popup, p); openWeb(p, { auto: true }); if (altOpenDate) renderAlts(); });
  }
  // (re)attach popup control handlers; called on open and after any setContent
  function wirePopup(popup, p) {
    const el = popup.getElement(); if (!el) return;
    const refresh = () => { popup.setContent(popupHtml(p)); setTimeout(() => wirePopup(popup, p), 0); renderList(); };
    el.querySelectorAll(".statusbtns button").forEach(b =>
      b.onclick = () => {
        const v = b.dataset.st;
        const next = (store.status[p.id] === v) ? null : v;
        if (next) store.status[p.id] = next; else delete store.status[p.id];
        Repo.setStatus(p.id, next).catch(e => showHint("Couldn't save that mark: " + e.message));
        save(); markers[p.id].setIcon(markerIcon(p)); refresh();
      });
    const ta = el.querySelector("textarea");
    if (ta) ta.oninput = () => {
      store.notes[p.id] = ta.value;
      clearTimeout(ta._t);
      ta._t = setTimeout(() => Repo.setNote(p.id, ta.value).catch(() => {}), 500);
      renderList();
    };
    const sb = el.querySelector(".setbase");
    if (sb) sb.onclick = () => { store.base = p.id; savePrefs({ basePlaceId: p.id }); refresh(); showHint("Base set to " + p.name); };
    const eb = el.querySelector(".extbtn");
    if (eb) eb.onclick = () => { markers[p.id] && markers[p.id].closePopup(); selectPlace(p); };
    const wb = el.querySelector(".wishbtn");
    if (wb) wb.onclick = () => {
      const t = (store.trips || []).find(x => x.id === openTripId) || (store.trips || [])[0];
      if (!t) { showHint("Create a trip first — open the Trips tab"); return; }
      t.wishlist = t.wishlist || [];
      if (t.wishlist.includes(p.id)) { showHint("Already an alternative in " + t.name); return; }
      t.wishlist.push(p.id); save();
      showHint("Added as an alternative — it shows under your " + (areaName(p.city) || "city") + " days");
      if (openTripId === t.id) renderTrip();
    };
    const del = el.querySelector(".del");
    if (del) del.onclick = () => deleteCustom(p.id);
  }

  function addMarker(p) {
    const m = L.marker([p.lat, p.lng], { icon: markerIcon(p) }).addTo(map);
    markers[p.id] = m;
    bindPopup(p);
  }
  // Districts arrive already assigned — the server holds the polygons and is
  // authoritative. The client copy is only used to prefill a dropped pin.
  allPlaces().forEach(addMarker);

  // ------------------------------------------------------------------ filtering
  function visible(p) {
    // when a trip is open, the map is scoped to that trip's places
    if (scopeTrip) {
      const inTrip = tripIdSet(scopeTrip).has(p.id);
      if (scopeMode === "day") return dayFocusIds.size ? dayFocusIds.has(p.id) : inTrip;
      if (scopeMode === "trip") return inTrip;
      const catOk = activeCats.has(CATEGORIES[p.c] ? p.c : "custom");   // the wider modes honour the category chips
      if (scopeMode === "unvisited") return inTrip || (catOk && store.status[p.id] !== "visited");
      return inTrip || catOk;                                          // "all"
    }
    if (ui.city && (p.city || "shanghai") !== ui.city) return false;
    if (!ui.city && ui.country && countryOf(p.city) !== ui.country) return false;
    const catKey = CATEGORIES[p.c] ? p.c : "custom";
    if (!activeCats.has(catKey)) return false;
    if (ui.district && p.d !== ui.district) return false;
    const st = store.status[p.id];
    if (ui.listOnly && !st) return false;
    if (ui.status) {
      if (ui.status === "marked" && !st) return false;
      if (ui.status !== "marked" && st !== ui.status) return false;
    }
    if (ui.search) {
      const q = ui.search.toLowerCase();
      const hay = (p.name + " " + (p.cn||"") + " " + (p.desc||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function applyMarkerVisibility() {
    allPlaces().forEach(p => {
      const m = markers[p.id]; if (!m) return;
      if (visible(p)) { if (!map.hasLayer(m)) m.addTo(map); }
      else { if (map.hasLayer(m)) map.removeLayer(m); }
    });
  }
  // re-icon (for highlight changes) + re-apply visibility (for scope changes)
  function refreshMarkers() {
    allPlaces().forEach(p => { const m = markers[p.id]; if (m) m.setIcon(markerIcon(p)); });
    applyMarkerVisibility();
  }

  // ------------------------------------------------------------------ list render
  const listEl = document.getElementById("list");
  function renderList() {
    applyMarkerVisibility();
    const shown = allPlaces().filter(visible);
    listEl.innerHTML = "";
    if (!shown.length) {
      listEl.innerHTML = `<div class="empty">No places match.<br>Try clearing filters or the search box.</div>`;
      return;
    }
    // group by district; places outside the mapped districts group by their area instead
    const groups = {};
    shown.forEach(p => {
      const k = DISTRICTS[p.d] ? p.d : ("area:" + (p.city || "other"));
      (groups[k] ||= []).push(p);
    });
    const order = [...Object.keys(DISTRICTS), ...Object.keys(groups).filter(k => k.startsWith("area:")).sort()];

    order.forEach(k => {
      const items = groups[k]; if (!items) return;
      const d = DISTRICTS[k];
      const a = !d ? areaOf(k.slice(5)) : null;
      const g = document.createElement("div"); g.className = "district-group";
      const head = document.createElement("div"); head.className = "district-head";
      head.innerHTML = d
        ? `<span class="swatch" style="background:${d.color}"></span><b>${d.name}</b><small>${d.cn}</small><span class="count">${items.length}</span>`
        : `<span class="swatch" style="background:#6c757d"></span><b>${a ? esc(a.name) : "My pins & other"}</b><small>${a ? esc(a.cn || countryName(a.country)) : ""}</small><span class="count">${items.length}</span>`;
      g.appendChild(head);
      if (d && d.blurb) {
        const bl = document.createElement("div"); bl.className = "district-blurb"; bl.textContent = d.blurb;
        g.appendChild(bl);
      }
      items.forEach(p => g.appendChild(placeRow(p)));
      listEl.appendChild(g);
    });
  }

  function placeRow(p) {
    const cat = catOf(p);
    const st = store.status[p.id];
    const note = store.notes[p.id];
    const row = document.createElement("div");
    row.className = "place" + (activeId === p.id ? " active" : "");
    row.innerHTML = `
      <div class="pin">${catIc(p)}</div>
      <div class="body">
        <div class="title">${p.name} <span class="cn">${p.cn||""}</span></div>
        ${p.desc?`<div class="desc">${p.desc}</div>`:""}
        <div class="meta">
          ${store.base===p.id?`<span class="base-tag">${ic("target","sm")}Base</span>`:(distInfo(p)?`<span class="dist-badge">${ic("pin","sm")}${kmText(distInfo(p).km)}</span>`:"")}
          ${p.hot?`<span class="hot-badge">${ic("flame","sm")}Trending</span>`:""}
          ${st?`<span class="status-badge s-${st}">${st==='want'?'Want':st==='planned'?'Planned':'Visited'}</span>`:""}
          ${note?`<span class="note-tag">${ic('note','sm')} ${note.slice(0,30)}${note.length>30?'…':''}</span>`:""}
        </div>
      </div>`;
    row.onclick = () => focusPlace(p);
    return row;
  }

  // ------------------------------------------------------------------ interactions
  let activeId = null;
  function focusPlace(p) {
    activeId = p.id;
    map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration: .6 });
    const m = markers[p.id];
    if (m) setTimeout(() => m.openPopup(), 350);
    renderList();
  }

  // category chips
  const chipsEl = document.getElementById("catChips");
  for (const [key, c] of Object.entries(CATEGORIES)) {
    const chip = document.createElement("div");
    chip.className = "chip"; chip.dataset.cat = key;
    chip.innerHTML = ic(key, "sm", c.color) + " " + c.label;
    chip.onclick = () => {
      if (activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
      chip.classList.toggle("off", !activeCats.has(key));
      renderList();
    };
    chipsEl.appendChild(chip);
  }

  // city tabs
  const cityTabsEl = document.getElementById("cityTabs");
  const countrySel = document.getElementById("countrySel");
  // country picker drives which area tabs are on offer
  function buildCountryOptions() {
    const cs = Object.entries(allCountries()).sort((a, b) => a[1].name.localeCompare(b[1].name));

      `<option value="__new">＋ New country…</option>`;

  function buildCityTabs() {
    const areas = Object.entries(allAreas())
      .filter(([, a]) => !ui.country || (a.country || "cn") === ui.country)
      .sort((a, b) => a[1].name.localeCompare(b[1].name));
    cityTabsEl.innerHTML = "";

  countrySel.onchange = async () => {
    if (countrySel.value === "__new") { countrySel.value = ui.country; await addCountry(); return; }
    ui.country = countrySel.value;
    // if the current area isn't in this country any more, widen to All
    if (ui.city && ui.country && countryOf(ui.city) !== ui.country) ui.city = "";
    buildCityTabs(); setCity(ui.city);
  };
  // Which area to open on. Once there are dozens of areas across several
  // countries, "the first one" lands you somewhere empty — so prefer where you
  // were last, then wherever your places actually are.
  function openingArea() {
    const last = store.prefs.lastArea;
    if (last && CITIES[last]) return last;
    const tally = {};
    PLACES.forEach(p => { if (p.city) tally[p.city] = (tally[p.city] || 0) + 1; });
    const best = Object.entries(tally).sort((a, b) => b[1] - a[1])[0];
    return (best && best[0]) || Object.keys(CITIES)[0] || "shanghai";
  }

  function setCity(city) {
    ui.city = city; ui.district = "";
    if (city && store.prefs.lastArea !== city) savePrefs({ lastArea: city });

    cityTabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.city === city));
    drawZones(); renderList();
    const a = areaOf(city);
    if (a && a.center) map.flyTo(a.center, a.zoom || 11, { duration: .6 });
    else map.flyTo([30.9, 120.8], 8, { duration: .6 });
  }

  // in-app modal (replaces prompt/confirm — those are unsupported in Electron)
  // opts: { title, message, okText, cancelText, fields:[{key,label,type,value,placeholder,options:[{value,label}]}] }
  // resolves to a values object (or true for a confirm with no fields), or null if cancelled.
  function showModal(opts) {
    return new Promise(resolve => {
      const fields = opts.fields || [];
      const esc2 = s => String(s == null ? "" : s).replace(/"/g, "&quot;").replace(/</g, "&lt;");
      const body = fields.map(f => {
        if (f.type === "select") {
          const os = (f.options || []).map(o => `<option value="${esc2(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc2(o.label)}</option>`).join("");
          return `<label class="mfield"><span>${esc2(f.label)}</span><select data-k="${f.key}">${os}</select></label>`;
        }
        return `<label class="mfield"><span>${esc2(f.label)}</span><input data-k="${f.key}" type="${f.type || "text"}" value="${esc2(f.value)}" placeholder="${esc2(f.placeholder || "")}"></label>`;
      }).join("");
      const back = document.createElement("div");
      back.className = "modal-back";
      back.innerHTML = `<div class="modal"><h3>${esc2(opts.title || "")}</h3>${opts.message ? `<p class="mmsg">${esc2(opts.message)}</p>` : ""}${body}
        <div class="mbtns"><button class="btn" data-c>${esc2(opts.cancelText || "Cancel")}</button><button class="btn primary" data-ok>${esc2(opts.okText || "OK")}</button></div></div>`;
      document.body.appendChild(back);
      const first = back.querySelector("input,select"); if (first) setTimeout(() => first.focus(), 30);
      const close = v => { back.remove(); resolve(v); };
      back.querySelector("[data-c]").onclick = () => close(null);
      back.querySelector("[data-ok]").onclick = () => {
        const vals = {}; back.querySelectorAll("[data-k]").forEach(el => vals[el.dataset.k] = (el.value || "").trim());
        close(fields.length ? vals : true);
      };
      back.onclick = e => { if (e.target === back) close(null); };
      back.addEventListener("keydown", e => {
        if (e.key === "Escape") close(null);
        else if (e.key === "Enter" && e.target.tagName !== "SELECT") back.querySelector("[data-ok]").click();
      });
    });
  }
  const confirmModal = (message, okText) => showModal({ title: okText || "Confirm", message, okText: okText || "OK" });

  // ================================================================
  //  Adding things: a country, an area, a place (with web lookup)
  // ================================================================
  async function addCountry(prefill) {
    const v = await showModal({ title: "New country", okText: "Add", fields: [
      { key: "name", label: "Country", value: prefill || "", placeholder: "e.g. Japan" },
      { key: "cn", label: "Local name (optional)", value: "" },
    ]});
    if (!v || !v.name) return null;
    const id = slug(v.name) || ("c" + Date.now());
    if (!allCountries()[id]) {
      try { await Repo.createCountry({ id: id.slice(0, 2), name: v.name, cn: v.cn || "" }); }
      catch (e) { showHint("Couldn't add that country: " + e.message); return null; }
      COUNTRIES[id.slice(0, 2)] = { name: v.name, cn: v.cn || "" };
    }
    buildCountryOptions();
    showHint(v.name + " added");
    return id.slice(0, 2);
  }

  // An "area" is the middle level — a city, a province, a national park, anything.
  async function addArea(prefillCountry) {
    const cs = Object.entries(allCountries()).sort((a, b) => a[1].name.localeCompare(b[1].name));
    const c = map.getCenter();
    const v = await showModal({ title: "New area", okText: "Add", message: "A city, province or region you want to record places in.", fields: [
      { key: "name", label: "Area name", placeholder: "e.g. Kyoto, or Hokkaido" },
      { key: "cn", label: "Local name (optional)", value: "" },
      { key: "country", label: "Country", type: "select", value: prefillCountry || ui.country || cs[0][0],
        options: cs.map(([k, x]) => ({ value: k, label: x.name })).concat([{ value: "__new", label: "＋ New country…" }]) },
      { key: "center", label: "Centre — paste a Google Maps link or “lat, lng”",
        value: c.lat.toFixed(4) + ", " + c.lng.toFixed(4), placeholder: "35.0116, 135.7681" },
      { key: "zoom", label: "Default zoom", value: "11" },
    ]});
    if (!v || !v.name) return null;
    let country = v.country;
    if (country === "__new") { country = await addCountry(); if (!country) return null; }
    const ll = parseLatLng(v.center);
    if (!ll) { showHint("Couldn't read those coordinates — paste a Google Maps link or “lat, lng”"); return null; }
    const id = slug(v.name) || ("a" + Date.now());
    if (allAreas()[id]) { showHint("An area called " + v.name + " already exists"); return id; }
    try {
      await Repo.createArea({ id, name: v.name, cn: v.cn || "", country, center: [ll.lat, ll.lng], zoom: +v.zoom || 11 });
    } catch (e) { showHint("Couldn't add that area: " + e.message); return null; }
    CITIES[id] = { name: v.name, cn: v.cn || "", country, center: [ll.lat, ll.lng], zoom: +v.zoom || 11, kind: "city" };
    buildCountryOptions(); ui.country = country; countrySel.value = country;
    buildCityTabs(); setCity(id);
    showHint(v.name + " added — drop places into it now");
    return id;
  }

      back.innerHTML = `<div class="modal wide">

      </div>`;
      document.body.appendChild(back);
      const $ = k => back.querySelector('[data-k="' + k + '"]');
      const help = back.querySelector("[data-coordhelp]");

      function fillCountries() {
        const cs = Object.entries(allCountries()).sort((a, b) => a[1].name.localeCompare(b[1].name));
        const cur = pre.city ? countryOf(pre.city) : (ui.country || cs[0][0]);
        $("country").innerHTML = cs.map(([k, c]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(c.name)}</option>`).join("")
          + `<option value="__new">＋ New country…</option>`;
      }
      function fillAreas() {
        const co = $("country").value;
        const as = Object.entries(allAreas()).filter(([, a]) => (a.country || "cn") === co)
          .sort((a, b) => a[1].name.localeCompare(b[1].name));
        const cur = pre.city && as.some(([k]) => k === pre.city) ? pre.city : (as[0] ? as[0][0] : "");
        $("city").innerHTML = as.map(([k, a]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(a.name)}</option>`).join("")
          + `<option value="__new">＋ New area…</option>`;

      function checkCoord() {
        const ll = parseLatLng($("coord").value);
        help.className = "mhelp " + (($("coord").value.trim() && !ll) ? "bad" : ll ? "ok" : "");
        help.textContent = ll ? ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5)
          : ($("coord").value.trim() ? "Couldn't find coordinates in that." : "Right-click a spot in Google Maps and copy the coordinates, or paste the whole URL.");

      fillCountries(); fillAreas(); checkCoord();

          lat: +ll.lat.toFixed(5), lng: +ll.lng.toFixed(5), link: ($("link").value || "").trim(),
          desc: ($("desc").value || "").trim(), status: $("status").value });
      };
      back.onclick = e => { if (e.target === back) close(null); };
      back.addEventListener("keydown", e => { if (e.key === "Escape") close(null); });
      setTimeout(() => $("name").focus(), 30);
    });
  }

  async function addPlaceFlow(pre) {
    const v = await placeForm(pre);
    if (!v) return null;

    try {
      // the server owns district assignment — it holds the polygons
      p = await Repo.createPlace({ name: v.name, cn: v.cn, c: v.c, city: v.city,
                                   lat: v.lat, lng: v.lng, link: v.link, desc: v.desc });
    } catch (e) { showHint("Couldn't add that place: " + e.message); return null; }

  // ==================================================================
  //  TRIPS  — multi-city itinerary planner (persisted in the database)
  // ==================================================================

  const cityTint = { shanghai: "#e63946", suzhou: "#c1121f", hangzhou: "#2a9d8f" };
  let openTripId = null;
  let focusedDate = null;
  let altOpenDate = null;    // which day's alternatives the extended sidebar is showing
  let altAllCities = false;  // extended sidebar: only this day's city, or every city
  let selectedPlaceId = null;
  let overviewOpen = false;  // couldn't-fit list expanded

  const isCafe = p => p.c === "coffee" || p.c === "matcha" || p.sub === "coffee" || p.sub === "matcha";
  // arrange a day's places into a rough time-of-day sequence
  // What you set by hand always wins over the guess below. A place with a real
  // clock time sorts by that time; one with only a slot sorts into that block.
  const SLOT_RANK = { morning: 0, noon: 1, evening: 2 };
  function sequenceDay(places, timing, date) {
    if (timing && date) {
      const fixed = [], loose = [];
      places.forEach(p => {
        const tm = timing[date + "|" + p.id];
        (tm && (tm.slot || tm.startTime) ? fixed : loose).push(p);
      });
      if (fixed.length) {
        const guessed = rawSequence(loose);
        const rank = (p) => {
          const tm = timing[date + "|" + p.id] || {};
          if (tm.startTime) return Number(tm.startTime.slice(0, 2)) < 12 ? 0 : Number(tm.startTime.slice(0, 2)) < 17 ? 1 : 2;
          return SLOT_RANK[tm.slot] ?? 1;
        };
        const label = (p) => {
          const tm = timing[date + "|" + p.id] || {};
          if (tm.startTime) return tm.startTime + (tm.endTime ? "–" + tm.endTime : "");
          return tm.slot === "morning" ? "Morning" : tm.slot === "evening" ? "Evening" : "Midday";
        };
        const out = fixed.map(p => ({ slot: label(p), p, rank: rank(p), pinned: true }))
          .concat(guessed.map(x => ({ ...x, rank: /morning|breakfast/i.test(x.slot) ? 0
            : /evening|dinner|night/i.test(x.slot) ? 2 : 1 })));
        return out.sort((a, b) => a.rank - b.rank ||
          ((a.slot > b.slot) ? 1 : (a.slot < b.slot) ? -1 : 0));
      }
    }
    return rawSequence(places);
  }
  function rawSequence(places) {
    const food = places.filter(p => p.c === "food");
    const cafe = places.filter(isCafe);
    const night = places.filter(p => p.c === "nightlife");
    const see = places.filter(p => ["sight", "culture", "nature", "shopping"].includes(p.c));
    const custom = places.filter(p => p.c === "custom");
    const seq = [];
    if (cafe[0]) seq.push({ slot: "Morning", p: cafe[0] });
    if (food.length >= 3) seq.push({ slot: "Breakfast", p: food.shift() });
    const half = Math.ceil(see.length / 2);
    see.slice(0, half).forEach(p => seq.push({ slot: "Morning", p }));
    if (food[0]) seq.push({ slot: "Lunch", p: food.shift() });
    see.slice(half).forEach(p => seq.push({ slot: "Afternoon", p }));
    if (cafe[1]) seq.push({ slot: "Afternoon", p: cafe[1] });
    custom.forEach(p => seq.push({ slot: "Anytime", p }));
    if (food[0]) seq.push({ slot: "Dinner", p: food.shift() });
    food.forEach(p => seq.push({ slot: "Snack", p }));
    cafe.slice(2).forEach(p => seq.push({ slot: "Coffee", p }));
    night.forEach(p => seq.push({ slot: "Evening", p }));
    return seq;
  }

  // date helpers (safe: noon avoids TZ/DST edge)
  function addDays(str, n) {
    const d = new Date(str + "T12:00:00"); d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmtDay(str) { return new Date(str + "T12:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); }
  function dateRange(a, b) { const out = []; let c = a; let guard = 0; while (c <= b && guard++ < 400) { out.push(c); c = addDays(c, 1); } return out; }
  const nights = s => Math.max(1, dateRange(s.start, s.end).length - 1);
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function findPlaceId(q) {
    const byName = PLACES.find(p => p.name === q) || PLACES.find(p => p.name.includes(q)) || PLACES.find(p => p.cn === q);
    return byName ? byName.id : null;
  }
  function nav(view) {
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
    document.getElementById("mapPanel").hidden = view !== "map";
    document.body.dataset.view = view;
    closeWeb();   // the mini browser belongs to whatever you were just looking at
    if (view === "map") {
      // Explore is map-first
      document.body.classList.add("map-open");
      document.getElementById("mapHide").hidden = true;
      clearScope(); renderList();
    } else {
      // Trips opens on the overview, map hidden until asked for
      document.body.classList.remove("map-open");
      document.getElementById("mapHide").hidden = true;
      renderTrip();
    }
    setTimeout(() => map.invalidateSize(), 360);
  }
  function clearScope() { scopeTrip = null; dayFocusIds = new Set(); dayFocusOrder = {}; focusedDate = null; hotelLayer.clearLayers(); showMapOverlay(false); closeAlts(); refreshMarkers(); }

  // The reference trip is seeded server-side (backend/scripts/seed.js) and any
  // trip you had in the old browser store is imported on first boot. Nothing is
  // fabricated in the client any more.

  // ---- render: list of trips OR a single trip's detail ----
  function segForDate(t, date) { return (t.segments || []).find(s => date >= s.start && date < s.end); }

  // Every stay this date touches. On a travel day that's two: the one you check out of
  // and the one you check into. Stays are inclusive of both their start and end dates here,
  // because the checkout morning is still a morning spent in that city.
  function segsForDate(t, date) {
    const out = [];
    (t.segments || []).forEach((s, i) => {
      if (date >= s.start && date <= s.end)
        out.push({ s, i, arrive: date === s.start, depart: date === s.end });
    });
    // earliest check-in first — that is the order you pass through them
    return out.sort((a, b) => (a.s.start < b.s.start ? -1 : a.s.start > b.s.start ? 1 : a.i - b.i));
  }
  // the cities you're in on this date, in the order you're in them
  function citiesForDate(t, date) {
    // The server works this out from the stays AND the commutes' resolved
    // areas, so it can see a day trip that never changes hotel. Fall back to
    // the local stays only for a trip that hasn't been saved yet.
    const fromServer = (t.areasByDay || {})[date];
    if (fromServer && fromServer.length) return fromServer;
    // In the order you actually move through them. Only CONSECUTIVE repeats are
    // collapsed, so a Shanghai → Suzhou → Shanghai day keeps all three legs.
    const seq = segsForDate(t, date)
      .map(x => x.s.city)
      .filter(Boolean)
      .filter((c, i, arr) => i === 0 || arr[i - 1] !== c);
    if (seq.length) return seq;
    const all = t.segments || [];
    if (!all.length) return [];
    const before = all.filter(s => s.end <= date).pop();   // outside every stay — use the nearest one
    return [(before || all[0]).city];
  }
  const cityLabel = (t, date) => citiesForDate(t, date).map(areaName).join(" → ");
  // Leaving the area — a different city, province or country. Moving hotels
  // within one city is not travel, which is the whole point of this check.
  function isTravelDay(t, date, cities) {
    const server = (t.travelDays || {})[date];
    if (server !== undefined) return !!server;
    return new Set(cities || citiesForDate(t, date)).size > 1;
  }
  // where the day ends up — the default for filtering and for "add a place here"
  function segCity(t, date) { const c = citiesForDate(t, date); return c.length ? c[c.length - 1] : ""; }

  // ---- trips live in two places: a nav rail in the sidebar, content on the stage ----
  const stage = document.getElementById("stage");
  let stageTab = "overview";       // "overview" | "plan"
  let stageDate = null;            // the day currently in focus inside the plan
  let collapsedDays = new Set();   // plan accordion — empty set means "all expanded"
  let addOpenDate = null;          // which day card has its add row showing
  const addCity = {};              // date -> which of the day's cities you're adding for

  const openTrip = () => store.trips.find(x => x.id === openTripId) || null;
  function renderTrip() {
    const t = openTrip();
    if (t) { t.wishlist = t.wishlist || []; scopeTrip = t; refreshMarkers(); drawHotels(t, focusedDate); showMapOverlay(true); }
    else { clearScope(); }
    renderStage(t);
  }
  const renderTripDetail = t => renderStage(t);

  function openTripById(id, tab) {
    openTripId = id; stageTab = tab || "overview"; stageDate = null;
    collapsedDays = new Set(); addOpenDate = null;
    focusedDate = null; dayFocusIds = new Set(); dayFocusOrder = {};   // no day in focus yet
    renderTrip();
    if (tab === "plan") stage.scrollTop = 0;
  }

  function openDay(t, date) {
    stageTab = "plan"; stageDate = date; collapsedDays.delete(date);
    renderStage(t);
    scrollToDay(date);
    if (mapOpen()) focusDayOnMap(t, date);
  }
  // Move the "you are here" highlight without re-rendering the whole plan —
  // a full re-render would yank the page out from under the tap.
  function markCurrentDay(date) {
    stage.querySelectorAll(".dsec.cur").forEach(el => el.classList.remove("cur"));
    const el = document.getElementById("day-" + date);
    if (el) el.classList.add("cur");
  }

  function scrollToDay(date) {
    setTimeout(() => {
      const el = document.getElementById("day-" + date);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 50);
  }

  // ---------- the contents rail ----------
  // It is a column of the stage, level with the content and flush to the left
  // edge — a rail indented inside the text column reads as a stray list.
  const stageCols = (rail, inner) => `<div class="stage-cols">${rail}<div class="stage-in">${inner}</div></div>`;

  // Overview jumps to a section, plan jumps to a day. One markup, two uses.
  const tocRail = (items, head) => !items.length ? "" : `<aside class="st-toc"><div class="toc-in">
      ${head ? `<div class="toc-h">${esc(head)}</div>` : ""}
      ${items.map(i => `<button class="toc-i" data-toc="${i.id}"${i.day ? ` data-tocday="${i.day}"` : ""}>
        ${i.num ? `<span class="toc-d">${esc(i.num)}</span>` : ""}
        <span>${esc(i.label)}${i.sub ? `<br><span class="toc-sub">${esc(i.sub)}</span>` : ""}</span>
        ${i.n != null ? `<span class="toc-n">${i.n}</span>` : ""}</button>`).join("")}
    </div></aside>`;

  // Follow the scroll rather than the last click: the rail should say where you
  // are, even when you got there by scrolling.
  function syncToc() {
    const items = [...stage.querySelectorAll("[data-toc]")];
    if (!items.length) return;
    const line = stage.getBoundingClientRect().top + 96;
    let cur = items[0].dataset.toc;
    items.forEach(btn => {
      const el = document.getElementById(btn.dataset.toc);
      if (el && el.getBoundingClientRect().top <= line) cur = btn.dataset.toc;
    });
    // a short final section never reaches the line, so the bottom of the scroll
    // always belongs to the last entry
    if (stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 4)
      cur = items[items.length - 1].dataset.toc;
    items.forEach(btn => btn.classList.toggle("on", btn.dataset.toc === cur));
  }
  let tocTick = 0;
  stage.addEventListener("scroll", () => {
    if (tocTick) return;
    tocTick = requestAnimationFrame(() => { tocTick = 0; syncToc(); });
  });

  // ---------- stage ----------
  function renderStage(t) {
    if (!t) { renderStageList(); return; }
    if (stageTab === "plan") renderStagePlan(t);
    else renderStageOverview(t);
  }

  // the trip list itself now lives on the stage
  function renderStageList() {
    const n = store.trips.length;
    let h = `<div class="stage-in">
      <div class="st-head">
        <div class="st-head-b">
          <h2 class="st-title">Trips</h2>

      </div>
      <div class="st-sec">`;
    if (!n) h += `<div class="tip-note">No trips yet. Create one, add city stays with dates, pick transport between them, add hotels, and drop places into each day.</div>`;
    store.trips.forEach(x => {
      const segs = x.segments || [];
      const areas = [...new Set(segs.map(s => areaName(s.city)))].join(" → ");
      const nd = dateRange(x.start, x.end).length;
      const nP = new Set(Object.values(x.plan || {}).flat().filter(id => placeById(id))).size;
      const nB = segs.filter(s => s.hotel).length;
      h += `<div class="trip-card" data-open="${x.id}">
        <h3>${esc(x.name)}</h3>
        <div class="sub">${fmtDay(x.start)} – ${fmtDay(x.end)} · ${nd} days${areas ? " · " + esc(areas) : ""}</div>
        <div class="tc-meta">${nP} place${nP === 1 ? "" : "s"} planned · ${nB} of ${segs.length} stay${segs.length === 1 ? "" : "s"} booked</div>
        <div class="tc-acts">
          <button class="btn sm" data-openov="${x.id}">${ic("layers", "sm")}Overview</button>
          <button class="btn sm" data-openplan="${x.id}">${ic("calendar", "sm")}Plan</button>
        </div></div>`;
    });
    h += `</div></div>`;
    stage.innerHTML = h;
    stage.querySelectorAll("[data-open]").forEach(c => c.onclick = (e) => {
      if (e.target.closest("button")) return;
      openTripById(c.dataset.open, "overview");
    });
    stage.querySelectorAll("[data-openov]").forEach(b => b.onclick = () => openTripById(b.dataset.openov, "overview"));
    stage.querySelectorAll("[data-openplan]").forEach(b => b.onclick = () => openTripById(b.dataset.openplan, "plan"));
    const nb = document.getElementById("stNewTrip");
    if (nb) nb.onclick = createTrip;
  }

  const tabsBar = () => `<div class="st-crumb">
      <button class="btn sm" id="stAll">${ic("back", "sm")}All trips</button>
      <div class="st-tabs">
        <button data-tab="overview" class="${stageTab === "overview" ? "on" : ""}">Overview</button>
        <button data-tab="plan" class="${stageTab === "plan" ? "on" : ""}">Plan</button>
      </div>
      <span class="spacer"></span>
      <button class="btn sm" id="stDel" title="Delete this trip">${ic("trash", "sm")}</button>
      <button class="btn sm" id="stMap">${ic("map", "sm")}${mapOpen() ? "Hide map" : "Show map"}</button>
    </div>`;

  // The kind catalogue comes from the database (GET /api/trips/commute-kinds),
  // so adding "sleeper train" server-side needs no change here.
  let COMMUTE_KINDS = [];
  const commuteKind = (id) => COMMUTE_KINDS.find(k => k.id === id)
    || { id: id || "other", label: id || "Transport", icon: "train", spans_days: false };
  const spanDays = (c) => dateRange(c.startDate, c.endDate || c.startDate).length;

  // Per-type detail lives in `attrs`; show only what's filled in.
  const ATTR_LABEL = {
    vendor: "with", vehicleClass: "car", plate: "plate", transmission: "gearbox",
    fuelPolicy: "fuel", insurance: "cover", deposit: "deposit", pickupInstructions: "pickup",
    terminal: "terminal", gate: "gate", seat: "seat", baggage: "bags", aircraft: "aircraft",
    cabin: "cabin", car: "carriage", platform: "platform", class: "class",
    passType: "pass", coverage: "covers", parking: "parking",
  };
  const attrLine = (c) => Object.entries(c.attrs || {})
    .filter(([, v]) => v != null && v !== "")
    .map(([k, v]) => `<span class="attr"><i>${esc(ATTR_LABEL[k] || k)}</i> ${esc(String(v))}</span>`)
    .join("");

  // One form for every kind: the shared fields, then whatever that kind adds.
  const KIND_FIELDS = {
    car_rental: [["vendor", "Rental company"], ["vehicleClass", "Vehicle"], ["plate", "Plate"],
                 ["fuelPolicy", "Fuel policy"], ["insurance", "Insurance"], ["deposit", "Deposit"]],
    car_own:    [["plate", "Plate"], ["parking", "Parking notes"], ["tolls", "Tolls"]],
    flight:     [["terminal", "Terminal"], ["seat", "Seat"], ["baggage", "Baggage"], ["cabin", "Cabin"]],
    train:      [["car", "Carriage"], ["seat", "Seat"], ["platform", "Platform"], ["class", "Class"]],
    ferry:      [["cabin", "Cabin"], ["deck", "Deck"]],
    rail_pass:  [["passType", "Pass"], ["coverage", "Covers"]],
  };

  async function editCommute(t, idx) {
    const cur = idx == null ? {} : (t.commutes[idx] || {});
    const kind = cur.kind || "car_rental";
    const k = commuteKind(kind);
    const extra = (KIND_FIELDS[kind] || []).map(([key, label]) =>
      ({ key: "a_" + key, label, value: (cur.attrs || {})[key] || "" }));
    const v = await showModal({
      title: idx == null ? "Add transport" : k.label,
      okText: "Save",
      message: "A hire car or a rail pass covers a range of days; a transfer is a single date.",
      fields: [
        { key: "kind", label: "Type", type: "select", value: kind,
          options: COMMUTE_KINDS.map(x => ({ value: x.id, label: x.label })) },
        { key: "label", label: "Description", value: cur.label || "", placeholder: "e.g. Hertz compact, Hongqiao pickup" },
        { key: "start", label: "From date", type: "date", value: cur.startDate || t.start },
        { key: "end", label: "To date (leave as-is for a single day)", type: "date", value: cur.endDate || cur.startDate || t.start },
        { key: "from", label: "Pick up / from", value: cur.fromLabel || "" },
        { key: "to", label: "Drop off / to", value: cur.toLabel || "" },
        { key: "code", label: "Booking reference", value: cur.code || "" },
        { key: "status", label: "Status", type: "select", value: cur.status || "idea",
          options: [{ value: "idea", label: "Idea" }, { value: "planned", label: "Planned" }, { value: "booked", label: "Booked" }] },
        ...extra,
      ],
    });
    if (!v) return;
    const attrs = {};
    (KIND_FIELDS[v.kind] || []).forEach(([key]) => { if (v["a_" + key]) attrs[key] = v["a_" + key]; });
    const row = {
      kind: v.kind, label: v.label || null, startDate: v.start,
      endDate: (v.end && v.end !== v.start) ? v.end : null,
      fromLabel: v.from || null, toLabel: v.to || null,
      code: v.code || null, status: v.status, attrs,
      direction: "internal",
    };
    t.commutes = t.commutes || [];
    if (idx == null) t.commutes.push(row); else t.commutes[idx] = Object.assign({}, cur, row);
    save(); renderStage(t);
  }

  // A place is shared; what it means on one day of one trip is not. Timing, a
  // note and where it falls in the day live on the trip item, not on the place.
  async function editItem(t, date, placeId) {
    const p = placeById(placeId); if (!p) return;
    const key = date + "|" + placeId;
    t.timing = t.timing || {};
    const cur = t.timing[key] || {};
    const v = await showModal({
      title: p.name,
      okText: "Save",
      message: fmtDay(date) + " — most stops only need a rough slot. Set a time only where it matters.",
      fields: [
        { key: "slot", label: "When", type: "select", value: cur.slot || "",
          options: [{ value: "", label: "Work it out for me" },
                    { value: "morning", label: "Morning" },
                    { value: "noon", label: "Midday" },
                    { value: "evening", label: "Evening" }] },
        { key: "start", label: "Starts at (optional)", value: cur.startTime || "", placeholder: "09:30" },
        { key: "end", label: "Ends at (optional)", value: cur.endTime || "", placeholder: "11:00" },
        { key: "note", label: "Note for this stop", value: cur.note || "",
          placeholder: "booked, ref 8821 · closes early on Mondays" },
      ],
    });
    if (!v) return;
    const hhmm = (x) => {
      const m = String(x || "").trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
      if (!m) return null;
      const hh = Math.min(23, +m[1]), mm = Math.min(59, +m[2]);
      return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
    };
    if (v.start && !hhmm(v.start)) { showHint("Couldn't read that start time — use 09:30"); return; }
    if (v.end && !hhmm(v.end)) { showHint("Couldn't read that end time — use 11:00"); return; }
    const next = { slot: v.slot || null, startTime: hhmm(v.start), endTime: hhmm(v.end), note: v.note || null };
    if (!next.slot && !next.startTime && !next.endTime && !next.note) delete t.timing[key];
    else t.timing[key] = next;
    save(); renderStage(t);
  }

  // People are stored server-side immediately: they aren't part of the plan
  // document, and a traveller's dates shouldn't wait on a debounce.
  async function editPerson(t, idx) {
    const cur = idx == null ? {} : (t.participants[idx] || {});
    const first = (cur.dates || [])[0] || {};
    const v = await showModal({
      title: idx == null ? "Add someone" : esc(cur.name),
      okText: "Save",
      message: "Leave the dates on the full trip unless they join late or leave early.",
      fields: [
        { key: "name", label: "Name", value: cur.name || "" },
        { key: "email", label: "Email (optional)", value: cur.email || "" },
        { key: "start", label: "Joins on", type: "date", value: first.startDate || t.start },
        { key: "end", label: "Leaves on", type: "date", value: first.endDate || t.end },
      ],
    });
    if (!v || !v.name) return;
    const whole = v.start === t.start && v.end === t.end;
    const body = {
      name: v.name, email: v.email || null,
      dates: whole ? [] : [{ startDate: v.start, endDate: v.end }],
    };
    try {
      t.participants = idx == null
        ? await Repo.addParticipant(t.id, body)
        : await Repo.updateParticipant(t.id, cur.id, body);
    } catch (e) { showHint("Couldn't save that: " + e.message); return; }
    renderStage(t);
  }

  const bkRow = o => `<div class="bk${o.missing ? " missing" : ""}">
      <span class="bk-ic">${ic(o.icon, "lg")}</span>
      <span class="bk-b">
        <span class="bk-when">${esc(o.when)}</span>
        <div class="bk-name">${o.name}</div>
        ${o.meta ? `<div class="bk-meta">${o.meta}</div>` : ""}
        ${o.acts ? `<div class="bk-acts">${o.acts}</div>` : ""}
      </span>
      ${o.tag ? `<span class="tag${o.missing ? " no" : ""}">${esc(o.tag)}</span>` : ""}
    </div>`;

  function renderStageOverview(t) {
    const days = dateRange(t.start, t.end);
    const areas = [...new Set(t.segments.map(s => s.city))];
    const countries = [...new Set(areas.map(countryOf))];
    const stays = t.segments.length;
    const booked = t.segments.filter(s => s.hotel).length;
    const plannedCount = new Set(Object.values(t.plan).flat().filter(id => placeById(id))).size;
    const cant = (t.wishlist || []).filter(id => placeById(id));

    const toc = [];
    let b = "";
    let h = `${tabsBar()}
      <h2 class="st-title">${esc(t.name)}</h2>
      <div class="st-sub">${fmtDay(t.start)} – ${fmtDay(t.end)} · ${days.length} days · ${plannedCount} places planned</div>
      <div class="st-chips">
        ${countries.map(c => `<span class="geo-chip country">${esc(countryName(c))}</span>`).join("")}
        ${areas.map(a => `<span class="geo-chip">${esc(areaName(a))}</span>`).join("")}
      </div>`;

    if (!t.segments.length) {
      h += `<div class="st-sec"><div class="tip-note">This trip has no city stays yet. Add one to build a day-by-day plan.</div>
        <button class="btn primary" id="stStay2">${ic("plus", "sm")}Add first city stay</button></div>`;
      stage.innerHTML = stageCols("", h); wireStage(t); return;
    }

    // ---- getting around: flights, and anything else you're holding ----
    toc.push({ id: "ov-transport", label: "Getting there" });
    b += `<section class="st-sec" id="ov-transport"><h3>${ic("plane", "sm")}Getting there
      <button class="h3btn" id="stCommute">${ic("plus", "sm")}Add transport</button></h3>`;
    [["Out", t.outbound], ["Back", t.inbound]].forEach(([lbl, f]) => {
      const has = f && (f.flight || f.leg);
      b += bkRow({
        icon: "plane", when: lbl + " · " + (f && f.date ? fmtDay(f.date) : "no date"),
        name: has ? esc(f.flight || "Flight") : "Not booked",
        meta: has ? esc(f.leg || "") : "Add the flight number and times.",
        acts: `<button data-flights>${ic("pencil", "sm")}${has ? "Edit" : "Add"}</button>`,
        tag: has ? "booked" : "to book", missing: !has,

    // hire cars, rail passes, transfers — the ones that can run across days
    (t.commutes || []).forEach((c, ci) => {
      const k = commuteKind(c.kind);

      b += bkRow({
        icon: k.icon, when: k.label + " · " + (span
          ? fmtDay(c.startDate) + " → " + fmtDay(c.endDate) + " · " + spanDays(c) + " days"
          : fmtDay(c.startDate)),

        ].filter(Boolean).join("<br>"),
        acts: `<button data-editcommute="${ci}">${ic("pencil", "sm")}Edit</button>
               <button data-rmcommute="${ci}">Remove</button>`,

        missing: c.status !== "booked",

    });
    b += `</section>`;

    // ---- who's coming, and for how long ----
    toc.push({ id: "ov-people", label: "Who's coming" });
    b += `<section class="st-sec" id="ov-people"><h3>${ic("users", "sm")}Who's coming<span class="cnt">${(t.participants || []).length || "just you"}</span>
      <button class="h3btn" id="stPerson">${ic("plus", "sm")}Add someone</button></h3>`;
    if (!(t.participants || []).length) {
      b += `<div class="tip-note">Nobody listed yet. Add the people travelling with you — each can have their own dates, because people don't always come for the whole trip.</div>`;
    } else {
      t.participants.forEach((p, pi) => {
        const when = p.wholeTrip
          ? "whole trip"
          : p.dates.map(d => fmtDay(d.startDate) + " → " + fmtDay(d.endDate)).join(", ");
        const nights = p.wholeTrip ? days.length : p.dates.reduce((n, d) => n + dateRange(d.startDate, d.endDate).length, 0);
        b += `<div class="person" data-person="${pi}">
