<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip Explorer</title>
  <!-- paint the saved theme before first render so there's no light-mode flash -->
  <script>
    (function () {
      var d = { mode: "light", accent: "purple", tone: { light: "mist", dark: "graphite" } };
      try {
        var s = JSON.parse(localStorage.getItem("planner-theme") || "{}");
        if (s.mode) d.mode = s.mode;
        if (s.accent) d.accent = s.accent;
        if (s.tone) { if (s.tone.light) d.tone.light = s.tone.light; if (s.tone.dark) d.tone.dark = s.tone.dark; }
      } catch (e) {}
      var r = document.documentElement;
      r.dataset.mode = d.mode; r.dataset.tone = d.tone[d.mode]; r.dataset.accent = d.accent;
    })();
  </script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    /* ============================================================
       Design tokens — mode (light/dark) × tone × accent
       Set on <html> as data-mode / data-tone / data-accent
       ============================================================ */
    :root {
      --font: "Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      --on-accent: #ffffff;
      --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
      --accent-line: color-mix(in srgb, var(--accent) 45%, var(--line));
      /* the "LED" — a soft halo around accent-coloured chrome, never a hard ring */
      --glow: 0 0 0 1px var(--accent-soft), 0 0 13px -3px var(--accent-glow);
      --radius: 11px;
    }

    /* ---- light tones (soft light greys) ---- */
    html[data-mode="light"] {
      --ink: #1f2430; --ink-2: #3a414e; --muted: #757c89;
      --shadow: 0 1px 3px rgba(18,22,30,.07), 0 8px 24px rgba(18,22,30,.05);
      --halo: #ffffff;
      --chip-bg: #eceff4; --chip-ink: #4a515e;
      --info-bg: #e9f1fb; --info-ink: #0a558c;
      --warn-bg: #fdf5e7; --warn-line: #eedfc2; --warn-ink: #7a5200;
      --danger-bg: #fdeceb; --danger-line: #f2c9c6;
      --ok: #2ca24a; --ok-bg: #f0faf3;
      --focus: #e9a825; --focus-soft: #ffeec2; --focus-ink: #46340a;
      --hot-bg: #ffe6d9; --hot-ink: #b8420d;
      --want-bg: #fff3cd; --want-ink: #8a5c08;
      --plan-bg: #d9e9fb; --plan-ink: #0a558c;
      --seen-bg: #d9f2de; --seen-ink: #1b7a34;
    }
    html[data-mode="light"][data-tone="mist"]  { --bg: #f1f2f5; --panel: #ffffff; --panel-2: #f7f8fa; --panel-3: #edeff3; --line: #e2e5ea; --line-2: #ced3db; --hover: #f0f2f6; }
    html[data-mode="light"][data-tone="stone"] { --bg: #eeeeec; --panel: #fbfbfa; --panel-2: #f4f4f2; --panel-3: #e9e9e6; --line: #e0e0dc; --line-2: #cbcbc5; --hover: #efefec; }
    html[data-mode="light"][data-tone="linen"] { --bg: #f2f0ec; --panel: #fdfcfa; --panel-2: #f7f4f0; --panel-3: #ebe8e2; --line: #e4e0d8; --line-2: #d0cbc0; --hover: #f1eee8; }

    /* ---- dark tones (soft dark greys, never pure black) ---- */
    html[data-mode="dark"] {
      color-scheme: dark;
      --ink: #e7e9ec; --ink-2: #c0c4cb; --muted: #8b919d;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.34);
      --halo: #101114;
      --chip-bg: #2f333a; --chip-ink: #b6bcc6;
      --info-bg: #1b2733; --info-ink: #8dbdea;
      --warn-bg: #2a2418; --warn-line: #443a24; --warn-ink: #e2be79;
      --danger-bg: #32211f; --danger-line: #4d2c29;
      --ok: #4cc46e; --ok-bg: #172619;
      --focus: #d9a032; --focus-soft: rgba(217,160,50,.22); --focus-ink: #161004;
      --hot-bg: #3a2418; --hot-ink: #ef9a6a;
      --want-bg: #33291180; --want-ink: #e0c169;
      --plan-bg: #17293c80; --plan-ink: #86bcf0;
      --seen-bg: #16301d80; --seen-ink: #74d18e;
    }
    html[data-mode="dark"][data-tone="graphite"] { --bg: #17181a; --panel: #202225; --panel-2: #26282c; --panel-3: #2c2f34; --line: #32353a; --line-2: #454951; --hover: #2a2d32; }
    html[data-mode="dark"][data-tone="slate"]    { --bg: #15181d; --panel: #1e222a; --panel-2: #242932; --panel-3: #2a303a; --line: #313743; --line-2: #434b5a; --hover: #282e38; }
    html[data-mode="dark"][data-tone="umber"]    { --bg: #191716; --panel: #232120; --panel-2: #2a2725; --panel-3: #312d2a; --line: #37332f; --line-2: #4b463f; --hover: #2d2a27; }

    /* ---- accents ---- */
    html[data-accent="purple"] { --accent: #6d4bd8; --accent-glow: rgba(124,92,240,.6); }
    html[data-mode="dark"][data-accent="purple"] { --accent: #9a7bf5; --accent-glow: rgba(154,123,245,.5); }
    html[data-accent="orange"] { --accent: #dd6210; --accent-glow: rgba(240,116,26,.55); }
    html[data-mode="dark"][data-accent="orange"] { --accent: #ff8b3d; --accent-glow: rgba(255,139,61,.45); }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font); -webkit-font-smoothing: antialiased;
      color: var(--ink); background: var(--bg); overflow: hidden;
      display: flex; flex-direction: column;
    }
    /* controls do NOT inherit the page font by default — make them */
    button, input, select, textarea, optgroup, option { font-family: var(--font); letter-spacing: .005em; }
    h1, h2, h3, h4 { font-weight: 500; letter-spacing: -.005em; }
    html, body, input, select, textarea, button { transition: background-color .25s ease, color .25s ease, border-color .25s ease; }

    /* monochrome line icons — they take the colour of whatever they sit in */
    .ic { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; fill: none;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2.5px; }
    .ic.sm { width: 12.5px; height: 12.5px; vertical-align: -2px; stroke-width: 1.8; }
    .ic.lg { width: 19px; height: 19px; vertical-align: -4px; stroke-width: 1.6; }
    .ic-acc { color: var(--accent); filter: drop-shadow(0 0 5px var(--accent-glow)); }
    button .ic, a .ic, label .ic { margin-right: 1px; }
    #app { display: flex; flex: 1; min-height: 0; position: relative; }
    .led { box-shadow: var(--glow); }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: 400px; flex: 0 0 auto; height: 100%; background: var(--panel);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
      box-shadow: var(--shadow); z-index: 500;
    }
    #resizer {
      flex: 0 0 7px; cursor: col-resize; background: transparent; z-index: 600;
      border-right: 1px solid transparent; transition: background .12s;
    }

    /* ---------- Top bar ---------- */
    #topbar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 11px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); z-index: 700; box-shadow: var(--shadow);
    }
    #topbar h1 { margin: 0; font-size: 13.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
    #topbar .nav { border: none; padding: 0; margin-left: 2px; }
    #topbar .nav::before { content: ""; align-self: stretch; width: 1px; background: var(--line); margin: 2px 12px 2px 0; }
    .webtog {
      margin-left: auto; width: 30px; height: 30px; flex: 0 0 auto; padding: 0; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
      display: flex; align-items: center; justify-content: center; transition: .18s;
    }
    .webtog:hover { border-color: var(--accent-line); color: var(--ink); }
    .webtog.on { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); box-shadow: var(--glow); }
    .menu-btn {
      width: 30px; height: 30px; flex: 0 0 auto; padding: 0; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel-2);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5px; transition: .18s;
    }
    .menu-btn span { display: block; width: 13px; height: 1.5px; border-radius: 2px; background: var(--muted); transition: .18s; }
    .menu-btn:hover { border-color: var(--accent-line); }
    .menu-btn:hover span { background: var(--accent); }
    .acc .an, .tone .tn, .set-label, .set-head span { letter-spacing: .04em; }
    .menu-btn.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--glow); }
    .menu-btn.on span { background: var(--accent); }
    .menu-btn.on span:nth-child(2) { width: 8px; }

    #sideBody { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #sideMain { position: absolute; inset: 0; display: flex; flex-direction: column;
      transition: transform .34s cubic-bezier(.4,0,.2,1), opacity .22s ease; }
    /* the settings drawer floats over whatever view you're in */
    #settings {
      position: absolute; top: 0; left: 0; bottom: 0; width: min(360px, 86vw); z-index: 920;
      display: flex; flex-direction: column; background: var(--panel);
      border-right: 1px solid var(--line); box-shadow: var(--shadow);
      transform: translateX(-101%); transition: transform .34s cubic-bezier(.4,0,.2,1);
    }
    body.settings-open #settings { transform: translateX(0); }
    #scrim { position: absolute; inset: 0; z-index: 910; background: color-mix(in srgb, #000 26%, transparent);
      opacity: 0; transition: opacity .28s ease; }
    #scrim[hidden] { display: none; }
    body.settings-open #scrim { opacity: 1; }
    .set-head { display: flex; align-items: center; padding: 12px 17px; border-bottom: 1px solid var(--line); }
    .set-head span { flex: 1; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .set-head button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; }
    .set-head button:hover { color: var(--accent); }
    .set-body { flex: 1; overflow-y: auto; padding: 20px 17px 28px; }
    .set-group { margin-bottom: 24px; }
    .set-label { font-size: 10.5px; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .set-hint { font-size: 11.5px; color: var(--muted); line-height: 1.55; margin-top: 10px; }
    .tones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .tone { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; cursor: pointer; background: var(--panel-2); text-align: center; transition: .16s; }
    .tone .sw { height: 36px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 7px; }
    .tone .tn { font-size: 11px; font-weight: 600; color: var(--muted); }
    .tone:hover { border-color: var(--line-2); }
    .tone.sel { border-color: var(--accent); box-shadow: var(--glow); }
    .tone.sel .tn { color: var(--accent); }
    .accents { display: flex; gap: 10px; }
    .acc { flex: 1; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: var(--radius);
      padding: 10px 11px; cursor: pointer; background: var(--panel-2); transition: .16s; }
    .acc .ring { width: 17px; height: 17px; border-radius: 50%; flex: 0 0 auto; }
    .acc .an { font-size: 11.5px; font-weight: 600; color: var(--muted); line-height: 1.25; }
    .acc:hover { border-color: var(--line-2); }
    .acc.sel { border-color: var(--accent); box-shadow: var(--glow); }
    .acc.sel .an { color: var(--accent); }

    /* ---------- Extended sidebar: a day's ALTERNATIVES ---------- */
    #altbar { flex: 0 1 336px; min-width: 240px; height: 100%; display: flex; flex-direction: column;
      background: var(--panel-2); border-right: 1px solid var(--line); box-shadow: var(--shadow); z-index: 490; }
    #altbar[hidden] { display: none; }
    .side-head { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .side-head .sh-t { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; flex: 1; min-width: 0; }
    .side-head .sh-t > div { min-width: 0; }
    .side-head .sh-t small { display: block; font-weight: 500; font-size: 11px; color: var(--muted);
      margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-head .sh-x { border: none; background: none; font-size: 15px; cursor: pointer; color: var(--muted); line-height: 1; }
    .side-head .sh-x:hover { color: var(--accent); }
    .alt-scope { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted);
      padding: 8px 13px 0; cursor: pointer; }
    #alt-body { flex: 1; min-height: 0; overflow-y: auto; padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
    #alt-foot { flex: 0 0 auto; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
    #alt-foot select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; color: var(--muted); background: var(--panel-2); }
    .altcard.sel { border-color: var(--accent); box-shadow: var(--glow); }

    /* ---------- Mini browser: right side of the screen ---------- */
    #webresizer { flex: 0 0 7px; cursor: col-resize; background: transparent; z-index: 600; transition: background .12s; }
    #webresizer[hidden] { display: none; }
    #webresizer:hover, #webresizer.drag { background: var(--accent); opacity: .5; }
    #webpanel { flex: 0 1 470px; min-width: 300px; height: 100%; display: flex; flex-direction: column;
      background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 480; }
    #webpanel[hidden] { display: none; }
    #web-detail { flex: 0 0 auto; max-height: 42%; overflow-y: auto; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    #web-detail .ext-gal { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 9px; }
    #web-detail .ext-gal img { height: 104px; border-radius: 9px; object-fit: cover; flex: 0 0 auto; background: var(--panel-3); }
    #web-detail .ext-cn { color: var(--muted); font-size: 12.5px; margin: 2px 0 6px; }
    #web-detail .ext-dist { display: inline-block; font-size: 12px; background: var(--chip-bg); color: var(--chip-ink); border-radius: 999px; padding: 3px 10px; font-weight: 600; margin-bottom: 8px; }
    #web-detail p { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); margin: 0 0 10px; }
    #web-detail .ext-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    #web-detail .ext-actions button, #web-detail .ext-actions a { font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; text-decoration: none; color: var(--ink); }
    #web-detail .ext-actions button:hover, #web-detail .ext-actions a:hover { border-color: var(--accent); color: var(--accent); }
    .web-qrow { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .web-qrow input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel-2); color: var(--ink); font-size: 12.5px; outline: none; }
    .web-qrow input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .web-qrow .iconbtn { width: 32px; }
    .web-tabs { display: flex; align-items: center; gap: 5px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    .web-tabs .navb { font-size: 12px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; color: var(--muted); }
    .web-tabs button { font-size: 11.5px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; color: var(--muted); }
    .web-tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: var(--glow); }
    .web-tabs #web-open { margin-left: auto; }
    .web-sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; }
    #miniweb { flex: 1; width: 100%; border: none; background: #fff; }
    #web-load { flex: 0 0 auto; font-size: 11px; color: var(--muted); padding: 4px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    #web-load[hidden] { display: none; }
    #resizer:hover, #resizer.drag { background: var(--accent); opacity: .5; }
    body.resizing { user-select: none; }
    .fatal { max-width: 460px; margin: 18vh auto; padding: 0 24px; text-align: center; font-family: var(--font); }
    .fatal h1 { font-size: 19px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 10px; }
    .fatal p { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
    .fatal code { font-size: 12.5px; background: var(--panel-3); border-radius: 6px; padding: 2px 7px; }
    body.resizing #map, body.resizing #webpanel { pointer-events: none; }

    /* ---------- Sidebar nav + panels ---------- */
    .nav { display: flex; gap: 0; align-items: stretch; }
    .nav button {
      position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 8px 17px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
      border: none; background: none; border-radius: 0; cursor: pointer; color: var(--muted); transition: color .14s;
    }
    .nav button + button::before { content: ""; position: absolute; left: 0; top: 24%; bottom: 24%; width: 1px; background: var(--line); }
    .nav button:hover { color: var(--ink); }
    .nav button.on { color: var(--accent); }
    .nav button.on::after {
      content: ""; position: absolute; left: 13px; right: 13px; bottom: -12px; height: 2px;
      border-radius: 2px; background: var(--accent); box-shadow: var(--glow);
    }
    .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .panel[hidden] { display: none; }

    /* pinned controls bar in a trip */
    .trip-sticky { padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: flex; flex-direction: column; gap: 8px; }
    .seg-row { display: flex; gap: 8px; }
    .seg { display: flex; flex: 1; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
    .seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 4px; font-size: 12px; font-weight: 600; letter-spacing: .03em; border: none; background: var(--panel); color: var(--muted); cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.on { background: var(--accent); color: var(--on-accent); box-shadow: var(--glow); }
    .scope-toggle.sticky { margin: 0; }

    /* day grouping: type headers + time slots */
    .overview { background: var(--panel-3); border-radius: 9px; padding: 9px 11px; margin-bottom: 12px; font-size: 12.5px; }
    .overview .ov-sum { color: var(--ink-2); }
    .overview .ov-toggle { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11.5px; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; }
    .ov-list { border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; margin-bottom: 12px; }
    .ov-item { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 13px; border-bottom: 1px solid var(--line); }
    .ov-item:last-child { border-bottom: none; }
    .ov-item .wname { flex: 1; cursor: pointer; min-width: 0; }
    .ov-item .wname:hover { color: var(--accent); }
    .slot { display: flex; gap: 9px; align-items: flex-start; padding: 2px 0; }
    .slot .slot-tag { flex: 0 0 86px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .11em; padding-top: 10px;
      color: color-mix(in srgb, var(--accent) 62%, var(--muted)); }
    .slot .slot-p { flex: 1; min-width: 0; }

    /* ---------- Trips ---------- */
    .trip-actions { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn { padding: 9px 12px; font-size: 13px; font-weight: 600; border: 1px solid var(--line);
      background: var(--panel); border-radius: 9px; cursor: pointer; color: var(--ink); }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: var(--glow); }
    .btn.primary:hover { color: var(--on-accent); filter: brightness(1.07); }
    .btn.sm { padding: 4px 9px; font-size: 11.5px; font-weight: 600; border-radius: 7px; }
    .trip-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; background: var(--panel); }
    .trip-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
    .trip-card h3 { margin: 0 0 3px; font-size: 15px; font-weight: 600; }
    .trip-card .sub { font-size: 12px; color: var(--muted); }

    .trip-head { margin-bottom: 12px; }
    .trip-head h2 { margin: 6px 0 2px; font-size: 17px; font-weight: 600; }
    .trip-head .dates { font-size: 12.5px; color: var(--muted); }
    .flight { display: flex; gap: 9px; align-items: center; background: var(--info-bg); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; margin: 8px 0; }
    .flight .fno { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--info-ink); white-space: nowrap; }
    .flight .leg { color: var(--ink-2); }

    .day { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: var(--panel); }
    .day-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); cursor: pointer; }
    .day-head:hover { background: var(--hover); }
    .day-head .dnum { font-weight: 700; font-size: 12px; color: var(--panel); background: var(--ink); border-radius: 6px; padding: 2px 7px; }
    .day-head .ddate { font-size: 13px; font-weight: 600; }
    .day-head .dcity { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; }
    .day-body { padding: 10px 12px; }
    .day.focused { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus-soft), 0 0 16px -6px var(--focus); }
    .day-head .focusbtn { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; font-size: 10.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: var(--panel); }
    .day.focused .day-head .focusbtn { background: var(--focus); color: var(--focus-ink); border-color: var(--focus); box-shadow: 0 0 11px -3px var(--focus); }
    .day-head .altsbtn { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent-line); border-radius: 6px; padding: 2px 6px; background: var(--accent-soft); }
    .day-head .altsbtn:hover { border-color: var(--accent); }
    .day-head .altsbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: var(--glow); }
    .dplace .dnum2 { flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%; background: var(--ink); color: var(--panel);
      font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .scope-toggle { display: flex; align-items: center; gap: 7px; font-size: 12.5px; background: var(--panel-3); border-radius: 9px; padding: 8px 11px; margin-bottom: 12px; cursor: pointer; }
    .scope-toggle input { width: 15px; height: 15px; accent-color: var(--accent); }

    .transport { border: 1px dashed var(--line-2); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; background: var(--panel-2); }
    .transport .tt-title { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .13em; }
    .opt { display: flex; gap: 8px; align-items: flex-start; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 12px; line-height: 1.35; background: var(--panel); }
    .opt:hover { border-color: var(--line-2); }
    .opt.chosen { border-color: var(--ok); background: var(--ok-bg); }
    .opt .radio { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line-2); flex: 0 0 auto; margin-top: 1px; }
    .opt.chosen .radio { border-color: var(--ok); background: var(--ok) radial-gradient(var(--panel) 28%, transparent 32%); }
    .opt-add { font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 0; }

    .hotelcard { display: flex; gap: 10px; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 11px; padding: 10px 11px; margin-bottom: 10px; }
    .hotelcard.need { background: var(--danger-bg); border-color: var(--danger-line); }
    .hotelcard .hc-ic { color: var(--warn-ink); display: flex; padding-top: 1px; }
    .hotelcard .hc-body { flex: 1; min-width: 0; }
    .hotelcard .hc-name { font-weight: 700; font-size: 13.5px; }
    .hotelcard .hc-area { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .hotelcard .hc-dates { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--warn-ink); font-weight: 600; margin-top: 4px; }
    .hotelcard .hc-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 7px; }
    .hotelcard .hc-links a, .hotelcard .hc-links button { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: none; padding: 0; }
    .hotelcard .hc-links a:hover, .hotelcard .hc-links button:hover { text-decoration: underline; }

    .dplace { display: flex; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .dplace:hover { background: var(--hover); }
    .dplace .pemoji { display: flex; }
    .dplace .pcn2 { color: var(--muted); font-size: 11.5px; }
    .dplace .pname { flex: 1; min-width: 0; }
    .add-place-sel { width: 100%; margin-top: 6px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; color: var(--muted); background: var(--panel-2); }
    .day-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 2px 4px; }
    .tip-note { font-size: 11.5px; color: var(--muted); background: var(--panel-3); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; line-height: 1.5; }

    /* Alternatives — place-cards, shown in the extended sidebar */
    .altcard { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: 0 2px 9px rgba(0,0,0,.07); padding: 8px; cursor: pointer; }
    .altcard:hover { border-color: var(--accent-line); }
    .altcard img { width: 50px; height: 50px; border-radius: 9px; object-fit: cover; flex: 0 0 auto; background: var(--panel-3); }
    .altcard .ac-body { flex: 1; min-width: 0; }
    .altcard .ac-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .altcard:hover .ac-name { color: var(--accent); }
    .altcard .ac-cn { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .altcard .ac-actions { display: flex; gap: 6px; margin-top: 6px; }
    .altcard .in-day { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ok); font-weight: 600; align-self: center; }

    .pop .extbtn { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; font-size: 12px; background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); border-radius: 7px; padding: 6px 9px; cursor: pointer; width: 100%; font-weight: 600; box-shadow: var(--glow); }
    .pop .extbtn:hover { filter: brightness(1.1); }
    .pop .wishbtn { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: 11.5px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); border-radius: 7px; padding: 5px 9px; cursor: pointer; width: 100%; }
    .pop .wishbtn:hover { border-color: var(--accent); }

    /* ---------- Modal ---------- */
    .modal-back { position: fixed; inset: 0; background: rgba(12,14,20,.5); display: flex; align-items: center; justify-content: center; z-index: 4000; }
    .modal { width: min(420px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .modal h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
    .modal .mmsg { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .mfield { display: block; margin: 12px 0; }
    .mfield span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .mfield input, .mfield select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; background: var(--panel-2); color: var(--ink); font-family: inherit; }
    .mfield input:focus, .mfield select:focus { border-color: var(--accent); outline: none; box-shadow: var(--glow); }
    .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .modal.wide { width: min(540px, 94vw); }
    .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .mgrid .mfield.full { grid-column: 1 / -1; }
    .mfield textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
      font-size: 13.5px; background: var(--panel-2); color: var(--ink); font-family: inherit; resize: vertical; min-height: 54px; }
    .mfield textarea:focus { border-color: var(--accent); outline: none; box-shadow: var(--glow); }
    .mhelp { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .mhelp.ok { color: var(--ok); font-weight: 600; }
    .mhelp.bad { color: var(--warn-ink); font-weight: 600; }
    .mrow { display: flex; gap: 8px; align-items: center; }
    .mrow .btn { flex: 0 0 auto; }

    .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    #countrySel { width: 100%; margin-bottom: 9px; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--panel); color: var(--ink); font-size: 12.5px; }
    .searchrow { display: flex; gap: 7px; align-items: stretch; }
    .searchrow #search { flex: 1; }
    .iconbtn { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
      width: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
      color: var(--muted); cursor: pointer; transition: .14s; }
    .iconbtn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
    .row .add-btn { margin-top: 0; }
    .row .add-btn:last-child { flex: 0 0 34%; }
    #search {
      width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font-family: inherit;
      font-size: 14px; outline: none; background: var(--panel-2); color: var(--ink);
    }
    #search:focus { border-color: var(--accent); background: var(--panel); box-shadow: var(--glow); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; font-size: 12.5px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer;
      user-select: none; transition: .14s;
    }
    .chip.off { opacity: .35; }
    .chip:hover { border-color: var(--line-2); }

    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .row select {
      flex: 1; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit;
      background: var(--panel); font-size: 13px; color: var(--ink);
    }
    .toggle { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .toggle input, .alt-scope input { accent-color: var(--accent); }

    /* ---------- List ---------- */
    #list { flex: 1; overflow-y: auto; padding: 6px 10px 20px; }
    .district-group { margin: 10px 8px 4px; }
    .district-head {
      display: flex; align-items: baseline; gap: 8px; padding: 6px 6px 4px;
      position: sticky; top: 0; background: var(--panel); z-index: 2;
    }
    .district-head .swatch { width: 10px; height: 10px; border-radius: 3px; align-self: center; }
    .district-head b { font-size: 13.5px; font-weight: 600; }
    .district-head small { color: var(--muted); font-size: 11.5px; }
    .district-head .count { margin-left: auto; color: var(--muted); font-size: 11.5px; }
    .district-blurb { font-size: 11.5px; color: var(--muted); margin: 0 6px 6px; line-height: 1.45; }

    .place {
      display: flex; gap: 10px; padding: 9px 8px; border-radius: 10px; cursor: pointer;
      align-items: flex-start; border: 1px solid transparent;
    }
    .place:hover { background: var(--hover); }
    .place.active { background: var(--panel); border-color: var(--accent-line); box-shadow: var(--glow); }
    .place .pin { display: flex; padding-top: 3px; }
    .place .body { flex: 1; min-width: 0; }
    .place .title { font-size: 13.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
    .place .title .cn { font-weight: 400; color: var(--muted); font-size: 12px; }
    .place .desc { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .place .meta { display: flex; gap: 6px; margin-top: 5px; align-items: center; flex-wrap: wrap; }
    .status-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; font-weight: 600; }
    .s-want    { background: var(--want-bg); color: var(--want-ink); }
    .s-planned { background: var(--plan-bg); color: var(--plan-ink); }
    .s-visited { background: var(--seen-bg); color: var(--seen-ink); }
    .note-tag  { font-size: 10.5px; color: var(--muted); }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; }

    footer { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; font-size: 12px; }
    footer button { flex: 1; padding: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 12px; }
    footer button:hover { border-color: var(--line-2); background: var(--panel-2); }

    /* ---------- Map ---------- */
    #mapWrap { position: relative; flex: 1 1 0; min-width: 0; height: 100%; }
    /* in Trips the map becomes a drawer that slides in from the right */
    /* Trips has no left sidebar — the plan panel IS the sidebar, and the map slides in beside it */
    body[data-view="trip"] #sidebar, body[data-view="trip"] #resizer { display: none; }
    body[data-view="trip"] #stage {
      flex: 0 1 100%; transition: flex-basis .34s cubic-bezier(.4,0,.2,1);
    }
    body.resizing[data-view="trip"] #stage { transition: none; }
    body[data-view="trip"].map-open #stage { flex-basis: var(--stagew, 44%); }
    body[data-view="trip"] #mapWrap { flex: 1 1 0; min-width: 0; border-left: 1px solid transparent; overflow: hidden; }
    body[data-view="trip"].map-open #mapWrap { border-left-color: var(--line); }
    /* the plan panel absorbs the squeeze, so the mini browser keeps the width you gave it */
    body[data-view="trip"] #webpanel { flex-shrink: 0; }
    #stageResizer { flex: 0 0 7px; cursor: col-resize; background: transparent; z-index: 600; transition: background .12s; }
    #stageResizer[hidden] { display: none; }
    #stageResizer:hover, #stageResizer.drag { background: var(--accent); opacity: .5; }
    body[data-view="map"] #stage { display: none; }
    .mapx {
      position: absolute; top: 14px; right: 14px; z-index: 630; width: 30px; height: 30px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--muted);
      background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow);
    }
    .mapx:hover { color: var(--accent); border-color: var(--accent-line); }
    .mapx[hidden] { display: none; }

    /* ---------- Centre stage: trip overview / day view ---------- */
    #stage { flex: 1 1 0; min-width: 0; height: 100%; overflow-y: auto; background: var(--bg); }
    .stage-in { max-width: 780px; margin: 0 auto; padding: 26px 30px 48px; }
    /* once the map is out, the plan reads as a side panel: flush left, tighter gutters */
    body.map-open[data-view="trip"] .stage-in { max-width: none; margin: 0; padding: 22px 22px 42px; }
    .st-head { display: flex; align-items: flex-start; gap: 14px; }
    .st-head .st-head-b { flex: 1; min-width: 0; }
    .st-head .btn { flex: 0 0 auto; }
    .st-crumb { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .st-crumb .btn { padding: 5px 11px; font-size: 12px; }
    .st-crumb .spacer { margin-left: auto; }
    .st-crumb2 { display: flex; gap: 8px; margin: 16px 0 6px; }
    .st-tabs { display: flex; align-items: stretch; }
    .st-tabs button {
      position: relative; padding: 7px 15px 9px; font-size: 12.5px; font-weight: 600; letter-spacing: .03em;
      border: none; background: none; color: var(--muted); cursor: pointer; transition: color .14s;
    }
    .st-tabs button + button::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 30%; width: 1px; background: var(--line); }
    .st-tabs button:hover { color: var(--ink); }
    .st-tabs button.on { color: var(--accent); }
    .st-tabs button.on::after {
      content: ""; position: absolute; left: 13px; right: 13px; bottom: 0; height: 2px;
      border-radius: 2px; background: var(--accent); box-shadow: var(--glow);
    }
    .h3btn { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
      letter-spacing: .02em; text-transform: none; font-weight: 600; color: var(--accent);
      background: none; border: none; cursor: pointer; padding: 0; }
    .h3btn:hover { text-decoration: underline; }

    /* trip cards on the stage */
    .trip-card .tc-meta { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
    .trip-card .tc-acts { display: flex; gap: 8px; margin-top: 11px; }

    /* plan accordion */
    .dsec { border: 1px solid var(--line); border-radius: 13px; background: var(--panel); margin-bottom: 9px; overflow: hidden; }
    .dsec.cur { border-color: var(--accent-line); box-shadow: var(--glow); }
    .dsec-h { display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer; user-select: none; }
    .dsec-h:hover { background: var(--hover); }
    .dsec-cv { display: flex; color: var(--muted); transform: rotate(-90deg); transition: transform .2s; }
    .dsec.open .dsec-cv { transform: none; }
    .dsec .dnum { font-weight: 700; font-size: 11.5px; color: var(--panel); background: var(--ink); border-radius: 6px; padding: 2px 7px; }
    .dsec.cur .dnum { background: var(--accent); color: var(--on-accent); }
    .dsec-date { font-size: 13px; font-weight: 600; min-width: 104px; }
    .dsec-city { font-size: 11.5px; color: var(--muted); flex: 1; min-width: 0; }
    .dsec-n { font-size: 11.5px; color: var(--muted); }
    .dsec-acts { display: flex; gap: 2px; }
    .dsec-acts button { display: flex; padding: 5px; border: none; background: none; color: var(--muted); cursor: pointer; border-radius: 7px; }
    .dsec-acts button:hover { color: var(--accent); background: var(--accent-soft); }
    .dsec-acts button.on { color: var(--accent); background: var(--accent-soft); box-shadow: var(--glow); }
    /* the day's city (or cities) — same weight whether it's one or three */
    .dsec-city { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
    .dsec-city .dcity { white-space: nowrap; font-weight: 600; color: var(--ink); font-size: 12.5px; }
    .dsec-city .darrow { color: var(--accent); margin: 0 6px; font-weight: 600; }
    .dsec.twocity .dnum { background: var(--accent); color: var(--on-accent); }
    .dsec-city .dr-flag { margin-left: 8px; }

    /* the add row the header "+" reveals */
    .addrow { display: flex; flex-direction: column; gap: 7px; padding: 10px; margin: 10px 0 4px;
      border: 1px solid var(--accent-line); border-radius: 10px; background: var(--accent-soft); }
    .addrow .seg { flex: 0 0 auto; }
    .addrow .seg button { padding: 6px 4px; font-size: 11.5px; }
    .addrow .add-place-sel { margin-top: 0; background: var(--panel); color: var(--ink); }
    .addrow-new { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
      font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0 2px; }
    .addrow-new:hover { text-decoration: underline; }

    /* which night of which stay this card is */
    .hc-role { margin-left: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; vertical-align: middle; }
    .hotelcard.leaving { opacity: .82; }
    .hotelcard.leaving .hc-role { color: var(--warn-ink); border-color: var(--danger-line); }
    .dplace .pcity { font-size: 10.5px; color: var(--muted); flex: 0 0 auto; margin-left: 6px; }
    .dsec:not(.twocity) .dplace .pcity { display: none; }
    .dsec-b { padding: 0 14px; }
    .dsec.open .dsec-b { padding: 2px 14px 14px; border-top: 1px solid var(--line); }
    .dsec:not(.open) .dsec-b { display: none; }

    /* two-step delete: drag the row left (or tap the grip) to reveal Remove */
    .swipe { position: relative; overflow: hidden; border-radius: 9px; margin: 2px 0; }
    .swipe .sw-back {
      position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: stretch;
      background: var(--danger-bg); border-radius: 9px;
    }
    .swipe .sw-del {
      display: inline-flex; align-items: center; gap: 5px; width: 96px; justify-content: center;
      border: none; background: none; color: var(--warn-ink); font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .swipe .sw-del:hover { background: color-mix(in srgb, var(--danger-line) 45%, transparent); }
    .swipe .sw-front { position: relative; background: var(--panel); touch-action: pan-y; transition: transform .22s cubic-bezier(.4,0,.2,1); }
    .swipe .sw-front.ov-item { border-bottom: none; padding: 8px 6px; }
    .swipe .sw-hint { margin-left: auto; display: flex; color: var(--muted); opacity: .45; padding: 2px; border-radius: 6px; cursor: pointer; }
    .swipe .sw-front:hover .sw-hint { opacity: 1; }
    .swipe .sw-hint:hover { color: var(--accent); }
    .swipe.open .sw-hint { color: var(--accent); opacity: 1; transform: rotate(180deg); }
    .st-title { font-size: 25px; font-weight: 500; letter-spacing: -.015em; margin: 0 0 5px; }
    .st-sub { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .st-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
    .geo-chip { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 3px 11px;
      background: var(--chip-bg); color: var(--chip-ink); }
    .geo-chip.country { background: var(--accent-soft); color: var(--accent); box-shadow: var(--glow); }
    .st-sec { margin-top: 30px; }
    .st-sec > h3 { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 600;
      letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 11px; }
    .st-sec > h3 .cnt { margin-left: auto; letter-spacing: .02em; text-transform: none; font-weight: 500; }
    .st-empty { font-size: 13px; color: var(--muted); padding: 34px 0; text-align: center; }

    /* display size stepper */
    .sizer { display: flex; align-items: center; gap: 8px; }
    .sizer button { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--panel);
      color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1; }
    .sizer button:hover { border-color: var(--accent-line); color: var(--accent); }
    .sizer #sizeVal { min-width: 52px; text-align: center; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sizer .sizer-reset { width: auto; padding: 0 10px; margin-left: auto; font-size: 11.5px; }

    /* contents rail — its own column down the left of the stage, not inside the text */
    /* the column runs the full height so its edge reads as a wall; only the
       list inside it sticks */
    .stage-cols { display: flex; align-items: stretch; min-height: 100%; }
    .stage-cols .stage-in { flex: 1 1 auto; min-width: 0; }
    .st-toc { flex: 0 0 178px; border-right: 1px solid var(--line); background: var(--panel-3); }
    .st-toc .toc-in { position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
      padding: 26px 12px 30px 18px; scrollbar-width: thin; }
    .st-toc::-webkit-scrollbar { width: 0; }
    .toc-i { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left;
      border: none; background: none; cursor: pointer; color: var(--muted);
      font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 7px; line-height: 1.3;
      border-left: 2px solid transparent; transition: color .12s, background .12s, border-color .12s; }
    .toc-i:hover { color: var(--ink); background: var(--panel-2); }
    .toc-i.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .toc-i .toc-n { margin-left: auto; font-size: 10.5px; opacity: .7; font-weight: 500; }
    .toc-i .toc-d { font-weight: 700; font-size: 11px; letter-spacing: .02em; min-width: 20px; }
    .toc-i .toc-sub { font-size: 10.5px; opacity: .75; }
    .toc-h { font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--muted); opacity: .7; padding: 0 9px 7px; }
    /* the rail is the first thing to go when the panel gets narrow */
    body.map-open[data-view="trip"] .st-toc, body[data-view="trip"] .st-toc:empty { display: none; }
    @media (max-width: 1000px) { .st-toc { display: none; } }

    /* eat & drink lists on the overview */
    .eat-list { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
    .eatrow { display: flex; align-items: center; gap: 9px; padding: 8px 12px; font-size: 13px;
      border-bottom: 1px solid var(--line); }
    .eatrow:last-child { border-bottom: none; }
    .eatrow:hover { background: var(--panel-2); }
    .eatrow .eat-n { flex: 1; min-width: 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .eatrow .eat-n:hover { color: var(--accent); }
    .eatrow .eat-city { font-size: 11px; color: var(--muted); }
    .eatrow .eat-day { font-size: 10.5px; font-weight: 700; border: 1px solid var(--line); background: var(--panel);
      color: var(--ink-2); border-radius: 6px; padding: 2px 7px; cursor: pointer; min-width: 34px; }
    .eatrow .eat-day:hover { border-color: var(--accent-line); color: var(--accent); }
    .eatrow .eat-day.none { border-style: dashed; cursor: default; color: var(--muted); font-weight: 500; }

    /* booking rows — the "what have I not booked yet" view */
    .bk { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--panel); padding: 12px 14px; margin-bottom: 9px; }
    .bk.missing { border-color: var(--danger-line); background: var(--danger-bg); }
    .bk .bk-ic { color: var(--muted); display: flex; padding-top: 2px; }
    .bk.missing .bk-ic { color: var(--warn-ink); }
    .bk .bk-b { flex: 1; min-width: 0; }
    .bk .bk-when { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .bk .bk-name { font-size: 14px; font-weight: 600; margin-top: 3px; }
    .bk .bk-meta { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
    .bk .bk-acts { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 8px; }
    .bk .bk-acts a, .bk .bk-acts button { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px;
      color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: none; padding: 0; }
    .bk .bk-acts a:hover, .bk .bk-acts button:hover { text-decoration: underline; }
    .bk .tag { flex: 0 0 auto; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      border-radius: 999px; padding: 3px 9px; background: var(--seen-bg); color: var(--seen-ink); }
    .bk .tag.no { background: color-mix(in srgb, var(--danger-line) 55%, transparent); color: var(--warn-ink); }

    /* the bed, as one line — detail lives on the overview */
    .hrow { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin: 6px 0;
      border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); font-size: 12.5px; }
    .hrow .hr-ic { display: flex; color: var(--muted); flex: 0 0 auto; }
    .hrow .hr-name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .hrow .hr-when { flex: 0 0 auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    .hrow .hr-acts { display: flex; gap: 1px; flex: 0 0 auto; }
    .hrow .hr-acts button { display: flex; padding: 4px; border: none; background: none;
      color: var(--muted); cursor: pointer; border-radius: 6px; }
    .hrow .hr-acts button:hover { color: var(--accent); background: var(--accent-soft); }
    .hrow.leaving { opacity: .78; }
    .hrow.need { border-color: var(--danger-line); background: var(--danger-bg); }
    .hrow.need .hr-when, .hrow.need .hr-ic { color: var(--warn-ink); }

    /* what a place means on this particular day */
    .dplace .ptime { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: var(--accent);
      background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
    .dplace .pnote { display: flex; color: var(--muted); opacity: .7; margin-left: 5px; }
    .swipe .sw-edit { flex: 0 0 auto; display: flex; padding: 3px; margin-left: 4px; border: none;
      background: none; color: var(--muted); opacity: .45; cursor: pointer; border-radius: 6px; }
    .swipe .sw-front:hover .sw-edit { opacity: 1; }
    .swipe .sw-edit:hover { color: var(--accent); background: var(--accent-soft); }

    /* per-type detail on a transport row */
    .bk .attr { display: inline-block; margin-right: 12px; white-space: nowrap; }
    .bk .attr i { font-style: normal; color: var(--muted); opacity: .75; margin-right: 3px;
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }

    /* who's coming */
    .person { display: flex; align-items: center; gap: 11px; border: 1px solid var(--line);
      border-radius: 11px; background: var(--panel); padding: 9px 13px; margin-bottom: 7px; }
    .person .pav { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
      background: var(--accent-soft); color: var(--accent); text-transform: uppercase; }
    .person .pb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .person .pn { font-size: 13.5px; font-weight: 600; }
    .person .ptag { margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--accent); background: var(--accent-soft);
      border-radius: 999px; padding: 2px 8px; }
    .person .pw { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .person .pacts { display: flex; gap: 2px; }
    .person .pacts button { display: flex; padding: 5px; border: none; background: none;
      color: var(--muted); cursor: pointer; border-radius: 7px; }
    .person .pacts button:hover { color: var(--accent); background: var(--accent-soft); }

    /* day rows on the overview */
    .dayrow { display: flex; align-items: center; gap: 11px; border: 1px solid var(--line); border-radius: 11px;
      background: var(--panel); padding: 10px 13px; margin-bottom: 7px; cursor: pointer; transition: .14s; }
    .dayrow:hover { border-color: var(--accent-line); transform: translateX(2px); }
    .dayrow .dnum { font-weight: 700; font-size: 11.5px; color: var(--panel); background: var(--ink); border-radius: 6px; padding: 2px 7px; }
    .dayrow .dr-date { font-size: 13px; font-weight: 600; min-width: 104px; }
    .dayrow .dr-city { font-size: 11.5px; color: var(--muted); flex: 1; min-width: 0; }
    .dayrow .dr-n { font-size: 11.5px; color: var(--muted); }
    .dayrow .dr-go { color: var(--muted); display: flex; }
    .dayrow:hover .dr-go { color: var(--accent); }
    .dayrow .dr-flag { font-size: 10.5px; font-weight: 700; color: var(--warn-ink); }

    #map { position: absolute; inset: 0; z-index: 1; background: var(--bg); }
    /* floating control over the map, top centre */
    #mapOverlay { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 620; }
    #mapOverlay[hidden] { display: none; }
    .map-scope {
      display: inline-flex; align-items: center; gap: 8px; user-select: none;
      font-size: 12.5px; letter-spacing: .01em; color: var(--muted);
      background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 15px; box-shadow: var(--shadow);
      transition: border-color .16s, box-shadow .16s;
    }
    .map-scope:hover { border-color: var(--accent-line); }
    .map-scope:has(select:focus) { border-color: var(--accent); box-shadow: var(--glow), var(--shadow); }
    .map-scope select {
      border: none; background: none; color: var(--ink); font-size: 12.5px; font-weight: 600;
      padding: 3px 4px; cursor: pointer; max-width: 250px;
    }
    .map-scope select:focus { outline: none; }
    body:not(.scope-trip) .map-scope { opacity: .96; }
    /* dark mode: tone the raster basemap down instead of blinding white */
    html[data-mode="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.86) contrast(.9) saturate(.72); }
    html[data-mode="dark"] .leaflet-popup-content-wrapper,
    html[data-mode="dark"] .leaflet-popup-tip,
    html[data-mode="dark"] .leaflet-control-zoom a,
    html[data-mode="dark"] .leaflet-control-attribution { background: var(--panel); color: var(--ink); }
    html[data-mode="dark"] .leaflet-control-zoom a { border-color: var(--line); }
    html[data-mode="dark"] .leaflet-control-attribution a { color: var(--muted); }
    .leaflet-popup-content { margin: 12px 14px; font-family: inherit; }
    .pop h3 { display: flex; align-items: center; gap: 7px; margin: 0 0 2px; font-size: 15px; font-weight: 600; }
    .pop .pcn { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .pop p { margin: 0 0 8px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
    .pop .statusbtns { display: flex; gap: 5px; margin-bottom: 8px; }
    .pop .statusbtns button {
      flex: 1; padding: 5px 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      border-radius: 7px; cursor: pointer; font-size: 11px; font-weight: 600;
    }
    .pop .statusbtns button.sel { color: #fff; border-color: transparent; }
    .pop .statusbtns button.sel.want    { background: #d99e0b; }
    .pop .statusbtns button.sel.planned { background: #2b7fd6; }
    .pop .statusbtns button.sel.visited { background: #2ca24a; }
    .pop textarea {
      width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); color: var(--ink);
      padding: 6px 8px; font-family: inherit; font-size: 12px; resize: vertical; outline: none;
    }
    .pop textarea:focus { border-color: var(--accent); }
    .pop .photo { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: var(--panel-3); }
    .pop .links { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
    .pop .links a {
      font-size: 11px; text-decoration: none; padding: 4px 8px; border: 1px solid var(--line);
      border-radius: 7px; color: var(--ink); background: var(--panel); white-space: nowrap;
    }
    .pop .links a:hover { border-color: var(--accent); color: var(--accent); }
    .pop .srcline { font-size: 11px; color: var(--muted); margin: -2px 0 8px; line-height: 1.4; }
    .pop .del { margin-top: 6px; font-size: 11px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; }

    /* hover image tooltip on markers (multi-image gallery) */
    .leaflet-tooltip.place-tt {
      padding: 0; border: none; background: var(--panel); border-radius: 10px; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 320px; color: var(--ink);
    }
    .leaflet-tooltip.place-tt::before { display: none; }
    .place-tt .gal { display: flex; }
    .place-tt .gal img { display: block; width: 104px; height: 96px; object-fit: cover; background: var(--panel-3); }
    .place-tt .gal.solo img { width: 220px; height: 130px; }
    .place-tt .gal.duo img { width: 145px; height: 110px; }
    .place-tt .ttname { padding: 6px 9px; font-size: 12.5px; font-weight: 600; line-height: 1.25; }
    .place-tt .ttname small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
    .place-tt .ttdist { display: flex; align-items: center; gap: 5px; padding: 0 9px 7px; font-size: 11px; color: var(--muted); }
    .place-tt .ttname { display: flex; align-items: flex-start; gap: 6px; }
    .place-tt .ttname > div { min-width: 0; }

    /* photo strip in popup */
    .pop .strip { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px; }
    .pop .strip img { height: 110px; border-radius: 7px; object-fit: cover; flex: 0 0 auto; background: var(--panel-3); }

    /* city tabs */
    .city-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .city-tabs button {
      flex: 1; padding: 8px 4px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line);
      background: var(--panel); border-radius: 9px; cursor: pointer; color: var(--muted); transition: .14s;
    }
    .city-tabs button small { font-weight: 400; opacity: .7; }
    .city-tabs button:hover { border-color: var(--line-2); }
    .city-tabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: var(--glow); }

    /* distance badges */
    .dist-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-ink); font-weight: 600; }
    .pop .distline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); background: var(--panel-3); border-radius: 8px; padding: 6px 9px; margin-bottom: 8px; }
    .pop .distline b { color: var(--ink); }
    .base-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; box-shadow: var(--glow); }
    .setbase { font-size: 11px; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; margin-top: 4px; }

    .marker-ring { border-radius: 50%; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.4); position: relative; }
    .hotel-pin { width: 32px; height: 32px; border-radius: 10px 10px 10px 2px; background: #7a5200; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
      border: 2px solid #ffd67a; box-shadow: 0 2px 6px rgba(0,0,0,.45); transform: rotate(-2deg); }
    .marker-ring .mnum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    .marker-ring.focus::after { content: ""; position: absolute; inset: -7px; border-radius: 50%;
      border: 2px solid var(--focus); box-shadow: 0 0 12px -2px var(--focus); animation: ping 1.5s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(2.1); opacity: 0; } }

    .zone-label {
      font-weight: 700; font-size: 12px; white-space: nowrap; text-align: center;
      line-height: 1.05; transform: translate(-50%, -50%);
      text-shadow: 0 0 3px var(--halo), 0 0 3px var(--halo), 0 0 5px var(--halo), 0 0 9px var(--halo);
      pointer-events: none;
    }
    .zone-label span { display: block; font-weight: 500; font-size: 10px; opacity: .8; }

    .add-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 10px; padding: 9px; font-size: 12.5px; font-weight: 600; letter-spacing: .03em;
      border: 1px dashed var(--line-2); border-radius: 9px; background: var(--panel-2); color: var(--ink);
      cursor: pointer; transition: .14s;
    }
    .add-btn:hover { border-color: var(--accent); color: var(--accent); }
    .add-btn.armed { background: var(--accent); color: var(--on-accent); border-style: solid; border-color: var(--accent); box-shadow: var(--glow); }
    .hot-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 6px; border-radius: 999px; background: var(--hot-bg); color: var(--hot-ink); font-weight: 700; }

    .hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: color-mix(in srgb, var(--ink) 93%, transparent); color: var(--bg); padding: 7px 14px; border-radius: 999px;
      font-size: 12px; z-index: 600; pointer-events: none; opacity: 0; transition: .3s;
    }
    .hint.show { opacity: 1; }

    @media (max-width: 720px) {
      #app { flex-direction: column; }
      #sidebar { width: 100%; min-width: 0; height: 46%; }
      #mapWrap { height: 54%; }
    }
  </style>
</head>
<body data-view="map">
  <div id="topbar">
    <button id="menuBtn" class="menu-btn" title="Settings"><span></span><span></span><span></span></button>
    <h1>Trip Explorer</h1>
    <nav class="nav" id="nav">
      <button data-view="map" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6.5v13L9 17l6 2.5 5.5-2.5v-13L15 9 9 6.5Z"/><path d="M9 6.5V17M15 9v10.5"/></svg>Explore</button>
      <button data-view="trip"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V5.6A1.6 1.6 0 0 1 10.1 4h3.8a1.6 1.6 0 0 1 1.6 1.6v1.9"/></svg>Trips</button>
    </nav>
    <button id="webToggle" class="webtog" title="Mini browser"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6c2.2 2.4 3.3 5.3 3.3 8.4s-1.1 6-3.3 8.4c-2.2-2.4-3.3-5.3-3.3-8.4s1.1-6 3.3-8.4Z"/></svg></button>
  </div>

  <div id="app">
    <!-- Settings is a drawer over the whole app, not part of the sidebar:
         the Trips view hides the sidebar, and the menu has to keep working. -->
    <div id="scrim" hidden></div>
    <div id="settings">
      <div class="set-head"><span>Settings</span><button id="set-close" title="Back"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg></button></div>
      <div class="set-body">
        <div class="set-group">
          <div class="set-label">Appearance</div>
          <div class="seg" id="modeSeg">
            <button data-tmode="light"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>Light</button><button data-tmode="dark"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8Z"/></svg>Dark</button>
          </div>
        </div>
        <div class="set-group">
          <div class="set-label">Tone</div>
          <div class="tones" id="toneRow"></div>
        </div>
        <div class="set-group">
          <div class="set-label">Accent</div>
          <div class="accents" id="accentRow"></div>
          <div class="set-hint">Accent-coloured controls carry a soft LED halo. Text stays plain.</div>
        </div>
        <div class="set-group">
          <div class="set-label">Display size</div>
          <div class="sizer">
            <button id="sizeDown" title="Smaller">&#8722;</button>
            <span id="sizeVal">100%</span>
            <button id="sizeUp" title="Bigger">+</button>

  <script>
  // ===========================================================================
  //  Everything below runs after the database has answered. There is no local
  //  copy of the trip: boot() is the single source of truth for this session.
  // ===========================================================================
  (async function main() {
  let BOOT;
  try {
    BOOT = await PlannerAPI.boot();
  } catch (e) {
    document.body.innerHTML = `<div class="fatal">
      <h1>Can't reach the trip server</h1>
      <p>${String(e.message).replace(/</g, "&lt;")}</p>
      <p class="hintline">Start the whole app with <code>npm start</code> from the project root, then reload.</p>
      <p class="hintline">Looking for it at <code>${PlannerAPI.BASE}</code>.</p></div>`;
    return;
  }
  const { Repo } = PlannerAPI;
  const PLACES = BOOT.PLACES;
  const COUNTRIES = BOOT.COUNTRIES;
  const CITIES = BOOT.CITIES;
  const DISTRICTS = BOOT.DISTRICTS;
  const SH_DISTRICTS_GEO = BOOT.GEOJSON;

  // ------------------------------------------------------------------ icons
  // Monochrome line icons; they inherit currentColor, so they follow the
  // accent (or whatever colour the element they sit in uses).
  const ICONS = {
    map: '<path d="M9 4 3.5 6.5v13L9 17l6 2.5 5.5-2.5v-13L15 9 9 6.5Z"/><path d="M9 6.5V17M15 9v10.5"/>',
    trip: '<rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V5.6A1.6 1.6 0 0 1 10.1 4h3.8a1.6 1.6 0 0 1 1.6 1.6v1.9"/>',
    sun: '<circle cx="12" cy="12" r="3.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>',

    x: '<path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>',
    plus: '<path d="M12 5.5v13M5.5 12h13"/>',
    car: '<path d="M4.4 15.5h15.2M6 15.5V19a1 1 0 0 1-1 1H4.4a1 1 0 0 1-1-1v-3.5l1.7-4.6A2 2 0 0 1 7 9.5h10a2 2 0 0 1 1.9 1.4l1.7 4.6V19a1 1 0 0 1-1 1H19a1 1 0 0 1-1-1v-3.5"/><circle cx="7.2" cy="12.9" r=".9"/><circle cx="16.8" cy="12.9" r=".9"/>',
    bus: '<rect x="4.5" y="4" width="15" height="13" rx="2.4"/><path d="M4.5 11h15M7.5 20v-3M16.5 20v-3"/><circle cx="8" cy="14" r=".9"/><circle cx="16" cy="14" r=".9"/>',
    ferry: '<path d="M3.5 17.5c1.6 0 1.6 1.4 3.2 1.4s1.6-1.4 3.3-1.4 1.6 1.4 3.2 1.4 1.7-1.4 3.3-1.4 1.6 1.4 3.2 1.4"/><path d="M5.6 14.2 12 4l6.4 10.2"/><path d="M8.4 9.6h7.2"/>',
