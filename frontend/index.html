          <span class="pb"><span class="pn">${esc(p.name)}${p.isOrganiser ? `<span class="ptag">organiser</span>` : ""}</span>
            <span class="pw">${esc(when)} · ${nights} day${nights === 1 ? "" : "s"}</span></span>
          <span class="pacts"><button data-editperson="${pi}">${ic("pencil", "sm")}</button>
            <button data-rmperson="${pi}">${ic("trash", "sm")}</button></span></div>`;
      });
    }
    b += `</section>`;

    // ---- stays ----
    toc.push({ id: "ov-stays", label: "Stays", n: stays });
    b += `<section class="st-sec" id="ov-stays"><h3>${ic("bed", "sm")}Stays<span class="cnt">${booked} of ${stays} booked</span>
      <button class="h3btn" id="stStay">${ic("plus", "sm")}Add stay</button></h3>`;
    t.segments.forEach((seg, si) => {
      const ho = seg.hotel;
      b += bkRow({
        icon: "bed",
        when: areaName(seg.city) + " · " + countryName(countryOf(seg.city)),
        name: ho ? esc(ho.name) : "No hotel booked",
        meta: `${fmtDay(seg.start)} → ${fmtDay(seg.end)} · ${nights(seg)} night${nights(seg) > 1 ? "s" : ""}`
          + `${seg.checkInTime || seg.checkOutTime ? ` · in ${esc(seg.checkInTime || "—")}, out ${esc(seg.checkOutTime || "—")}` : ""}`
          + `${ho && ho.area ? "<br>" + esc(ho.area) : ""}`,
        acts: ho
          ? `${typeof ho.lat === "number" ? `<button data-hotelmap="${si}">${ic("pin", "sm")}On map</button>` : ""}
             ${ho.link ? `<a href="${esc(ho.link)}" target="_blank" rel="noopener">${ic("map", "sm")}Maps</a>` : ""}
             <button data-edithotel="${si}">${ic("pencil", "sm")}Edit</button>
             <button data-rmhotel="${si}">Remove</button>`
          : `<button data-addhotel="${si}">${ic("plus", "sm")}Add hotel</button>
             <button data-hotelweb="${si}">${ic("search", "sm")}Find one</button>`,
        tag: ho ? "booked" : "to book", missing: !ho,
      });
    });
    b += `</section>`;

    // ---- transport between areas ----
    if (t.legs.length) {
      toc.push({ id: "ov-legs", label: "Between cities", n: t.legs.length });
      b += `<section class="st-sec" id="ov-legs"><h3>${ic("train", "sm")}Between cities</h3>`;
      t.legs.forEach((l, li) => {
        const chosen = l.options[l.chosen];
        b += bkRow({
          icon: commuteKind((l.kinds || [])[l.chosen]).icon, when: fmtDay(l.date),
          name: esc(l.from) + " → " + esc(l.to),
          meta: chosen ? esc(chosen) : "No option chosen yet.",
          acts: `<button data-legday="${l.date}">${ic("layers", "sm")}Open that day</button>`,
          tag: chosen ? "chosen" : "to pick", missing: !chosen,
        });
      });
      b += `</section>`;
    }

    // ---- eating and drinking, lifted out of the days so you can see it as a list ----
    // Scope is the trip, not the catalogue: what's on a day plus what you shortlisted.
    const dayOf = {};
    days.forEach(d => (t.plan[d] || []).forEach(id => { if (!dayOf[id]) dayOf[id] = d; }));
    const inTrip = [...new Set([...Object.values(t.plan).flat(), ...(t.wishlist || [])])]
      .map(placeById).filter(Boolean);
    const eatSec = (id, icon, label, cats, empty) => {
      const list = inTrip.filter(p => cats.includes(p.c)).sort((x, y) => {
        const dx = dayOf[x.id] ? days.indexOf(dayOf[x.id]) : 99;
        const dy = dayOf[y.id] ? days.indexOf(dayOf[y.id]) : 99;
        return dx - dy || x.name.localeCompare(y.name);
      });
      toc.push({ id: "ov-" + id, label, n: list.length });
      b += `<section class="st-sec" id="ov-${id}"><h3>${ic(icon, "sm")}${esc(label)}<span class="cnt">${list.length}</span></h3>`;
      if (!list.length) { b += `<div class="tip-note">${esc(empty)}</div></section>`; return; }
      b += `<div class="eat-list">`;
      list.forEach(p => {
        const d = dayOf[p.id];
        b += `<div class="eatrow">
          <span class="eat-ic">${catIc(p, "sm")}</span>
          <span class="eat-n" data-fly="${p.id}">${esc(p.name)}${p.cn ? ` <span class="pcn2">${esc(p.cn)}</span>` : ""}</span>
          <span class="eat-city">${esc(areaName(p.city))}</span>
          ${d ? `<button class="eat-day" data-day="${d}" title="Open ${esc(fmtDay(d))} in the plan">D${days.indexOf(d) + 1}</button>`
              : `<span class="eat-day none" title="Saved for this trip, not on a day yet">—</span>`}
        </div>`;
      });
      b += `</div></section>`;
    };
    eatSec("coffee", "coffee", "Coffee & matcha", ["coffee", "matcha"],
      "No cafes on this trip yet — add one to a day, or shortlist it for later.");
    eatSec("food", "food", "Restaurants", ["food"],
      "No restaurants on this trip yet — add one to a day, or shortlist it for later.");

    // ---- days ----
    toc.push({ id: "ov-days", label: "Days", n: days.length });
    b += `<section class="st-sec" id="ov-days"><h3>${ic("calendar", "sm")}Days<span class="cnt">tap to open in the plan</span></h3>`;
    days.forEach((date, i) => {
      const nP = (t.plan[date] || []).filter(id => placeById(id)).length;
      const flags = [];
      if (t.outbound.date === date) flags.push("arrive");
      if (t.inbound.date === date) flags.push("depart");
      if (isTravelDay(t, date)) flags.push("travel");
      b += `<div class="dayrow" data-day="${date}">
        <span class="dnum">D${i + 1}</span>
        <span class="dr-date">${fmtDay(date)}</span>
        <span class="dr-city">${esc(cityLabel(t, date))}${flags.length ? ` · <span class="dr-flag">${flags.join(" · ")}</span>` : ""}</span>
        <span class="dr-n">${nP ? nP + " place" + (nP > 1 ? "s" : "") : "free"}</span>
        <span class="dr-go">${ic("back", "sm")}</span></div>`;
    });
    b += `</section>`;

    // ---- couldn't fit ----
    if (cant.length) {
      toc.push({ id: "ov-cant", label: "Not scheduled", n: cant.length });
      b += `<section class="st-sec" id="ov-cant"><h3>${ic("layers", "sm")}Not scheduled<span class="cnt">${cant.length}</span></h3><div class="ov-list">`;
      cant.forEach(id => { const p = placeById(id); b += wishRow(p); });
      b += `</div></section>`;
    }
    stage.innerHTML = stageCols(tocRail(toc), h + b);
    wireStage(t);
  }

  // ---------- plan: every day as an expand/collapse section, all open by default ----------
  function renderStagePlan(t) {
    const days = dateRange(t.start, t.end);
    const toc = [];
    let b = "";
    let h = `${tabsBar()}
      <h2 class="st-title">Plan</h2>
      <div class="st-sub">${esc(t.name)} · ${fmtDay(t.start)} – ${fmtDay(t.end)} · ${days.length} days</div>
      <div class="st-crumb2">
        <button class="btn sm" id="stExpand">Expand all</button>
        <button class="btn sm" id="stCollapse">Collapse all</button>
      </div>`;
    if (!t.segments.length)
      b += `<div class="tip-note">No city stays yet — add one on the overview so these days know where you are.</div>`;
    days.forEach((date, i) => {
      const cities = citiesForDate(t, date);
      const nP = (t.plan[date] || []).filter(id => placeById(id)).length;
      const open = !collapsedDays.has(date);
      const flags = [];
      if (t.outbound.date === date) flags.push("arrive");
      if (t.inbound.date === date) flags.push("depart");
      // only when you actually leave the area — a hotel change across town isn't travel
      if (isTravelDay(t, date, cities)) flags.push("travel");
      const cityBits = cities.map((c, n) =>
        `<span class="dcity">${n ? `<span class="darrow">→</span>` : ""}${esc(areaName(c))}</span>`).join("");
      toc.push({ id: "day-" + date, day: date, num: "D" + (i + 1), label: fmtDay(date),
        sub: cities.map(areaName).join(" → "), n: nP || null });
      b += `<section class="dsec${open ? " open" : ""}${stageDate === date ? " cur" : ""}${cities.length > 1 ? " twocity" : ""}" id="day-${date}">
        <header class="dsec-h" data-toggle="${date}">
          <span class="dsec-cv">${ic("down", "sm")}</span>
          <span class="dnum">D${i + 1}</span>
          <span class="dsec-date">${fmtDay(date)}</span>
          <span class="dsec-city">${cityBits}${flags.length ? ` <span class="dr-flag">${flags.join(" · ")}</span>` : ""}</span>
          <span class="dsec-n">${nP ? nP + " place" + (nP > 1 ? "s" : "") : "free"}</span>
          <span class="dsec-acts">
            <button data-dfocus="${date}" title="Focus this day on the map">${ic("target", "sm")}</button>
            <button data-dalts="${date}" title="Alternatives for this day">${ic("layers", "sm")}</button>
            <button data-dadd="${date}" class="${addOpenDate === date ? "on" : ""}" title="Add a place to this day">${ic("plus", "sm")}</button>
          </span>
        </header>
        <div class="dsec-b">${open ? dayBody(t, date) : ""}</div>
      </section>`;
    });
    stage.innerHTML = stageCols(tocRail(toc, "Days"), h + b);
    wireStage(t);
  }

  // one day's contents — the add row, flights, transport, beds, the time-ordered places
  function dayBody(t, date) {
    const cities = citiesForDate(t, date);
    const city = segCity(t, date);
    const ids = (t.plan[date] || []);
    const dayPlaces = ids.map(placeById).filter(Boolean);
    let h = "";

    // "＋" in the header opens this: pick the city first when the day spans two
    if (addOpenDate === date) {
      const pick = (cities.includes(addCity[date]) ? addCity[date] : city) || "";
      h += `<div class="addrow">`;
      if (cities.length > 1)
        h += `<div class="seg sm">${cities.map(c =>
          `<button data-addcity="${c}" data-addd="${date}" class="${c === pick ? "on" : ""}">${esc(areaName(c))}</button>`).join("")}</div>`;
      const opts = allPlaces().filter(p => (!pick || p.city === pick) && !ids.includes(p.id))
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(p => `<option value="${p.id}">${esc(p.name)}${p.cn ? " · " + esc(p.cn) : ""}</option>`).join("");
      h += `<select class="add-place-sel" data-adddate="${date}"><option value="">Add a ${esc(areaName(pick) || "")} place…</option>${opts}</select>
        <button class="addrow-new" data-newplace="${pick}" data-newdate="${date}">${ic("plus", "sm")}Add a place that isn't listed</button>
      </div>`;
    }

    if (t.outbound.date === date && (t.outbound.flight || t.outbound.leg))
      h += `<div class="flight"><span class="fno">${ic("plane", "sm")}${esc(t.outbound.flight)}</span><span class="leg">arrive ${esc(String(t.outbound.leg).split("→").pop().trim())}</span></div>`;

    const li = t.legs.findIndex(l => l.date === date);
    if (li >= 0) {
      const l = t.legs[li];
      h += `<div class="transport"><div class="tt-title">${ic("train", "sm")}${esc(l.from)} → ${esc(l.to)}</div>`;
      l.options.forEach((o, oi) => {
        h += `<div class="opt ${l.chosen === oi ? "chosen" : ""}" data-leg="${li}" data-opt="${oi}"><span class="radio"></span><span>${esc(o)}</span></div>`;
      });
      h += `<button class="opt-add" data-addopt="${li}">${ic("plus", "sm")}add option</button></div>`;
    }

    // One line per bed. The plan is a guide you read at a glance, so the detail
    // (address, links, the full stay range) stays on the overview.
    segsForDate(t, date).forEach(({ s: seg, i: si, arrive, depart }) => {
      const ho = seg.hotel;
      const nAll = nights(seg);
      const nSoFar = dateRange(seg.start, date).length - 1;
      const where = areaName(seg.city);
      // what matters today: arriving, leaving, or just which night this is
      let when;
      if (arrive && depart) when = `check in ${seg.checkInTime || "—"} · 1 night`;
      else if (arrive)      when = `check in ${seg.checkInTime || "—"} · ${nAll} night${nAll > 1 ? "s" : ""}`;
      else if (depart)      when = `check out ${seg.checkOutTime || "—"}`;
      else                  when = `night ${nSoFar} of ${nAll}`;
      if (ho)
        h += `<div class="hrow${depart && !arrive ? " leaving" : ""}">
            <span class="hr-ic">${ic("bed", "sm")}</span>
            <span class="hr-name" title="${esc(ho.area || where)}">${esc(ho.name)}</span>
            <span class="hr-when">${esc(when)}</span>
            <span class="hr-acts">
              ${typeof ho.lat === "number" ? `<button data-hotelmap="${si}" title="Show on map">${ic("pin", "sm")}</button>` : ""}
              <button data-edithotel="${si}" title="Edit this stay">${ic("pencil", "sm")}</button>
            </span></div>`;
      else
        h += `<div class="hrow need">
            <span class="hr-ic">${ic("bed", "sm")}</span>
            <span class="hr-name">No hotel in ${esc(where)}</span>
            <span class="hr-when">${esc(fmtDay(seg.start))} → ${esc(fmtDay(seg.end))}</span>
            <span class="hr-acts"><button data-addhotel="${si}" title="Add a hotel">${ic("plus", "sm")}</button></span>
          </div>`;
    });

    sequenceDay(dayPlaces, t.timing, date).forEach(({ slot, p }) => {
      h += `<div class="slot"><div class="slot-tag">${slot}</div><div class="slot-p">${dayPlaceRow(p, date, t)}</div></div>`;
    });

    if (t.inbound.date === date && (t.inbound.flight || t.inbound.leg))
      h += `<div class="flight"><span class="fno">${ic("plane", "sm")}${esc(t.inbound.flight)}</span><span class="leg">depart ${esc(t.inbound.leg)}</span></div>`;

    if (!dayPlaces.length && t.outbound.date !== date && t.inbound.date !== date && li < 0)
      h += `<div class="day-empty">Free day — nothing planned yet.</div>`;
    return h;
  }

  // ---------- rows you can remove — two steps, never one stray tap ----------
  const swipeRow = (cls, attrs, inner, delAttrs, extraActs) => `<div class="swipe">
      <div class="sw-back"><button class="sw-del" ${delAttrs}>${ic("trash", "sm")}Remove</button></div>
      <div class="sw-front ${cls}" ${attrs}>${inner}
        ${extraActs || ""}
        <span class="sw-hint" data-swipeopen title="Swipe left — or tap — to remove">${ic("back", "sm")}</span>
      </div>
    </div>`;

  const dayPlaceRow = (p, date, t) => {
    const tm = ((t && t.timing) || {})[date + "|" + p.id] || {};
    const when = tm.startTime ? tm.startTime + (tm.endTime ? "–" + tm.endTime : "") : "";
    return swipeRow("dplace", `data-fly="${p.id}" data-day-of="${date}"`,
      `<span class="pemoji">${catIc(p, "sm")}</span>
       <span class="pname">${esc(p.name)} <span class="pcn2">${esc(p.cn || "")}</span></span>
       ${when ? `<span class="ptime">${esc(when)}</span>` : ""}
       ${tm.note ? `<span class="pnote" title="${esc(tm.note)}">${ic("note", "sm")}</span>` : ""}
       <span class="pcity">${esc(areaName(p.city))}</span>`,
      `data-rm="${p.id}" data-date="${date}"`,
      // edit sits before the swipe grip: the common action is nearer the text,
      // the destructive one stays behind a deliberate gesture
      `<button class="sw-edit" data-edititem="${p.id}" data-itemdate="${date}"
               title="Timing and notes for this stop">${ic("pencil", "sm")}</button>`);
  };

  const wishRow = p => swipeRow("ov-item", `data-fly="${p.id}"`,
    `<span class="wname">${catIc(p, "sm")} ${esc(p.name)} <span class="pcn2">${esc(areaName(p.city))}</span></span>`,
    `data-wrm="${p.id}"`);

  // drag the row left (or tap the grip) to reveal Remove; tapping Remove is the second step
  function wireSwipes(root) {
    root.querySelectorAll(".swipe").forEach(row => {
      const front = row.querySelector(".sw-front");
      if (!front) return;
      const W = 96;
      let x0 = null, y0 = 0, base = 0, dx = 0, dragging = false;
      const shut = () => { row.classList.remove("open"); front.style.transform = ""; };
      const show = () => { row.classList.add("open"); front.style.transform = "translateX(-" + W + "px)"; };
      front.addEventListener("pointerdown", (e) => {
        if (e.target.closest("[data-swipeopen]") || e.target.closest(".sw-del")
            || e.target.closest(".sw-edit")) return;
        x0 = e.clientX; y0 = e.clientY;
        base = row.classList.contains("open") ? -W : 0;
        dx = base; dragging = false;
      });
      front.addEventListener("pointermove", (e) => {
        if (x0 === null) return;
        const mx = e.clientX - x0, my = e.clientY - y0;
        if (!dragging) {
          // don't hijack the pointer until it's clearly a sideways drag — a tap must stay a tap
          if (Math.abs(mx) < 8 || Math.abs(mx) < Math.abs(my)) return;
          dragging = true;
          front.style.transition = "none";
          try { front.setPointerCapture(e.pointerId); } catch (err) {}
        }
        dx = Math.min(0, Math.max(-W, base + mx));
        front.style.transform = "translateX(" + dx + "px)";
      });
      const finish = () => {
        if (x0 === null) return;
        x0 = null;
        if (!dragging) return;                 // plain tap — leave the click alone
        dragging = false; front.style.transition = "";
        if (dx < -W / 2) show(); else shut();
        front.dataset.drag = "1";
        setTimeout(() => { front.dataset.drag = ""; }, 0);
      };
      front.addEventListener("pointerup", finish);
      front.addEventListener("pointercancel", finish);
      const grip = front.querySelector("[data-swipeopen]");
      if (grip) grip.onclick = (e) => { e.stopPropagation(); row.classList.contains("open") ? shut() : show(); };
    });
  }
  function shutSwipes(except) {
    document.querySelectorAll(".swipe.open").forEach(r => {
      if (except && r === except) return;
      r.classList.remove("open");
      const f = r.querySelector(".sw-front"); if (f) f.style.transform = "";
    });
  }

  // ---------- one wiring pass for whatever the stage is showing ----------
  function wireStage(t) {
    const byId = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    byId("stMap", () => { setMapOpen(!mapOpen()); renderStage(t); });
    byId("stAll", () => { openTripId = null; stageTab = "overview"; stageDate = null; renderTrip(); });
    byId("stDel", async () => {
      if (!await confirmModal("Delete “" + t.name + "”? This can't be undone.", "Delete")) return;
      try { await Repo.deleteTrip(t.id); }
      catch (e) { showHint("Couldn't delete that trip: " + e.message); return; }
      store.trips = store.trips.filter(x => x.id !== t.id);
      delete lastPushed[t.id];
      openTripId = null; stageTab = "overview"; renderTrip();
    });
    byId("stStay", () => addCityStay(t));
    byId("stCommute", () => editCommute(t, null));
    byId("stPerson", () => editPerson(t, null));
    stage.querySelectorAll("[data-editcommute]").forEach(b => b.onclick = () => editCommute(t, +b.dataset.editcommute));
    stage.querySelectorAll("[data-rmcommute]").forEach(b => b.onclick = async () => {
      if (!await confirmModal("Remove this transport?", "Remove")) return;
      t.commutes.splice(+b.dataset.rmcommute, 1); save(); renderStage(t);
    });
    stage.querySelectorAll("[data-edititem]").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      editItem(t, b.dataset.itemdate, b.dataset.edititem);
    });
    stage.querySelectorAll("[data-editperson]").forEach(b => b.onclick = () => editPerson(t, +b.dataset.editperson));
    stage.querySelectorAll("[data-rmperson]").forEach(b => b.onclick = async () => {
      const p = t.participants[+b.dataset.rmperson];
      if (!await confirmModal("Remove " + p.name + " from this trip?", "Remove")) return;
      try { await Repo.removeParticipant(t.id, p.id); t.participants.splice(+b.dataset.rmperson, 1); }
      catch (e) { showHint("Couldn't remove: " + e.message); return; }
      renderStage(t);
    });
    byId("stStay2", () => addCityStay(t));
    byId("stExpand", () => { collapsedDays = new Set(); renderStage(t); });
    byId("stCollapse", () => { collapsedDays = new Set(dateRange(t.start, t.end)); renderStage(t); });
    stage.querySelectorAll("[data-toc]").forEach(btn => btn.onclick = () => {
      // a day in the rail opens that day properly (expand, select, focus the map);
      // a section just scrolls
      if (btn.dataset.tocday) { openDay(t, btn.dataset.tocday); return; }
      const el = document.getElementById(btn.dataset.toc);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    stage.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      stageTab = b.dataset.tab; stageDate = null;
      focusedDate = null; dayFocusIds = new Set(); dayFocusOrder = {};
      refreshMarkers(); drawHotels(t);
      renderStage(t); stage.scrollTop = 0;
    });

    stage.querySelectorAll("[data-toggle]").forEach(hd => hd.onclick = (e) => {
      if (e.target.closest("button")) return;
      const date = hd.dataset.toggle;
      if (collapsedDays.has(date)) collapsedDays.delete(date); else collapsedDays.add(date);
      stageDate = date; renderStage(t);
    });
    stage.querySelectorAll("[data-dadd]").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const date = b.dataset.dadd;
      addOpenDate = addOpenDate === date ? null : date;
      if (addOpenDate) collapsedDays.delete(date);
      renderStage(t);
    });
    stage.querySelectorAll("[data-addcity]").forEach(b => b.onclick = () => {
      addCity[b.dataset.addd] = b.dataset.addcity; renderStage(t);
    });
    stage.querySelectorAll("[data-newplace]").forEach(b => b.onclick = async () => {
      const date = b.dataset.newdate;
      const p = await addPlaceFlow({ city: b.dataset.newplace || undefined });
      if (!p) return;
      (t.plan[date] = t.plan[date] || []).push(p.id); save();
      nav("trip"); renderTrip();
    });
    stage.querySelectorAll("[data-dfocus]").forEach(b => b.onclick = (e) => {
      e.stopPropagation(); stageDate = b.dataset.dfocus; renderStage(t); focusDayOnMap(t, b.dataset.dfocus);
    });
    stage.querySelectorAll("[data-dalts]").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const date = b.dataset.dalts;
      if (altOpenDate === date) closeAlts(); else openAlts(date);
    });

    stage.querySelectorAll("[data-day]").forEach(el => el.onclick = () => openDay(t, el.dataset.day));
    stage.querySelectorAll("[data-legday]").forEach(el => el.onclick = () => openDay(t, el.dataset.legday));
    stage.querySelectorAll("[data-flights]").forEach(el => el.onclick = () => editFlights(t));
    stage.querySelectorAll(".opt").forEach(o => o.onclick = () => { t.legs[+o.dataset.leg].chosen = +o.dataset.opt; save(); renderStage(t); });
    stage.querySelectorAll("[data-addopt]").forEach(b => b.onclick = async () => {
      const v = await showModal({ title: "Add transport option", okText: "Add", fields: [
        { key: "s", label: "Describe the option", placeholder: "G-train ~30 min ¥40" }]});
      if (!v || !v.s) return;
      t.legs[+b.dataset.addopt].options.push(v.s); save(); renderStage(t);
    });
    stage.querySelectorAll("[data-fly]").forEach(d => d.onclick = (e) => {
      if (e.target.closest("[data-swipeopen]") || e.target.closest("[data-edititem]")) return;
      const front = d.closest(".sw-front");
      if (front && front.dataset.drag === "1") return;          // that was a drag, not a tap
      if (d.closest(".swipe.open")) { shutSwipes(); return; }   // first tap just puts the row back
      const p = placeById(d.dataset.fly); if (!p) return;
      const wasOpen = mapOpen();
      const date = d.dataset.dayOf;
      if (date) {
        stageDate = date;
        setDayFocus(t, date);                     // light up the whole day's route around it
        markCurrentDay(date);                     // and move the highlight to that card
      }
      setMapOpen(true);
      // if the map is only just sliding in, let it finish sizing before flying
      selectPlace(p, wasOpen ? 0 : 400);
    });
    stage.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
      const date = b.dataset.date;
      t.plan[date] = (t.plan[date] || []).filter(x => x !== b.dataset.rm); save(); renderTrip();
    });
    stage.querySelectorAll("[data-adddate]").forEach(sel => sel.onchange = () => {
      if (!sel.value) return;
      const date = sel.dataset.adddate;
      (t.plan[date] = t.plan[date] || []).push(sel.value); save();
      if (focusedDate === date) setDayFocus(t, date);   // keep the map in step
      renderTrip();
    });
    stage.querySelectorAll("[data-addhotel]").forEach(b => b.onclick = () => editHotel(t, +b.dataset.addhotel));
    stage.querySelectorAll("[data-edithotel]").forEach(b => b.onclick = () => editHotel(t, +b.dataset.edithotel));
    stage.querySelectorAll("[data-rmhotel]").forEach(b => b.onclick = () => {
      const seg = t.segments[+b.dataset.rmhotel];
      seg.hotel = null; seg.placeId = null;      // the hotel place itself stays in the catalogue
      save(); drawHotels(t, focusedDate); renderStage(t);
    });
    stage.querySelectorAll("[data-hotelweb]").forEach(b => b.onclick = () => {
      const seg = t.segments[+b.dataset.hotelweb];
      openWebQuery("hotels in " + areaName(seg.city) + " " + fmtDay(seg.start) + " to " + fmtDay(seg.end));
    });

  // A hotel is a place (kind='lodging'), so it gets real geography, a district
  // and a map pin of its own — and it survives being detached from this trip.
  async function editHotel(t, si) {
    const seg = t.segments[si]; const cur = seg.hotel || {};
    const v = await showModal({ title: "Hotel", okText: "Save", fields: [
      { key: "name", label: "Hotel name (leave blank to remove)", value: cur.name || "" },
      { key: "area", label: "Area / address (optional)", value: cur.area || "" },
      { key: "link", label: "Booking / map link (optional)", value: cur.link || "" },
      { key: "coords", label: "Location — paste a Google Maps link or “lat, lng”",
        value: (typeof cur.lat === "number") ? cur.lat + ", " + cur.lng : "" },
      { key: "ci", label: "Check-in time", value: seg.ownCheckInTime || seg.checkInTime || "", placeholder: "15:00" },
      { key: "co", label: "Check-out time", value: seg.ownCheckOutTime || seg.checkOutTime || "", placeholder: "11:00" },
    ]});
    if (v == null) return;
    const hhmm = (x) => {
      const m = String(x || "").trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
      if (!m) return null;
      return String(Math.min(23, +m[1])).padStart(2, "0") + ":" + String(Math.min(59, +m[2])).padStart(2, "0");
    };
    // the times belong to the stay, not the hotel — an early check-in is yours alone
    seg.ownCheckInTime = hhmm(v.ci); seg.ownCheckOutTime = hhmm(v.co);
    seg.checkInTime = seg.ownCheckInTime || seg.checkInTime;
    seg.checkOutTime = seg.ownCheckOutTime || seg.checkOutTime;
    if (!v.name) { seg.hotel = null; seg.placeId = null; save(); renderTripDetail(t); drawHotels(t, focusedDate); return; }

    const ll = v.coords ? parseLatLng(v.coords) : null;
    const lat = ll ? ll.lat : cur.lat, lng = ll ? ll.lng : cur.lng;
    try {
      const place = await Repo.upsertHotel({
        id: seg.placeId || null, name: v.name, area: v.area, link: v.link,
        lat, lng, city: seg.city || null,
      });
      // keep the local catalogue in step so the pin and popup resolve
      const at = PLACES.findIndex(p => p.id === place.id);
      if (at >= 0) PLACES[at] = place; else PLACES.push(place);
      seg.placeId = place.id;
      seg.hotel = { name: place.name, area: place.address || "", link: place.link || "", lat: place.lat, lng: place.lng };
    } catch (e) { showHint("Couldn't save that hotel: " + e.message); return; }
    save(); renderTripDetail(t); drawHotels(t, focusedDate);
  }

  async function addCityStay(t) {
    const last = t.segments[t.segments.length - 1];
    const defStart = last ? last.end : t.start;
    const areaOpts = Object.entries(allAreas())
      .sort((a, b) => (countryName(a[1].country) + a[1].name).localeCompare(countryName(b[1].country) + b[1].name))
      .map(([k, a]) => ({ value: k, label: countryName(a.country) + " · " + a.name + (a.cn ? " · " + a.cn : "") }));
    const v = await showModal({ title: "Add a stay", okText: "Add", fields: [
      { key: "city", label: "Area", type: "select", value: last ? last.city : "shanghai",
        options: areaOpts.concat([{ value: "__new", label: "＋ New area…" }]) },
      { key: "start", label: "Check-in date", type: "date", value: defStart },
      { key: "end", label: "Check-out date", type: "date", value: addDays(defStart, 2) },
    ]});
    if (!v || !v.start || !v.end) return;
    if (v.city === "__new") { const id = await addArea(); if (!id) return; v.city = id; }
    if (!areaOf(v.city)) return;
    t.segments.push({ city: v.city, start: v.start, end: v.end, hotel: null });
    if (last) t.legs.push({ from: areaName(last.city), to: areaName(v.city), date: v.start,

    if (v.end > t.end) t.end = v.end;
    if (v.start < t.start) t.start = v.start;
    save(); renderTripDetail(t);
  }

      { id: "graphite", name: "Graphite", sw: "linear-gradient(140deg,#26282c 48%,#17181a 48%)" },
      { id: "slate",    name: "Slate",    sw: "linear-gradient(140deg,#242932 48%,#15181d 48%)" },
      { id: "umber",    name: "Umber",    sw: "linear-gradient(140deg,#2a2725 48%,#191716 48%)" },
    ],
  };
  const ACCENTS = [
    { id: "purple", name: "Royal purple",  light: "#6d4bd8", dark: "#9a7bf5" },
    { id: "orange", name: "Sunset orange", light: "#dd6210", dark: "#ff8b3d" },
  ];
  const theme = { mode: "light", accent: "purple", tone: { light: "mist", dark: "graphite" } };
  try {
    const s = Object.assign({}, JSON.parse(localStorage.getItem("planner-theme") || "{}"), store.prefs.theme || {});
    if (s.mode === "light" || s.mode === "dark") theme.mode = s.mode;
    if (ACCENTS.some(a => a.id === s.accent)) theme.accent = s.accent;
    if (s.tone) { if (s.tone.light) theme.tone.light = s.tone.light; if (s.tone.dark) theme.tone.dark = s.tone.dark; }
  } catch (e) {}

  function applyTheme() {
    const r = document.documentElement;
    if (!TONES[theme.mode].some(t => t.id === theme.tone[theme.mode])) theme.tone[theme.mode] = TONES[theme.mode][0].id;
    r.dataset.mode = theme.mode;
    r.dataset.tone = theme.tone[theme.mode];
    r.dataset.accent = theme.accent;
    localStorage.setItem("planner-theme", JSON.stringify(theme));   // first-paint cache only
    savePrefs({ theme });                                            // the real home
    renderSettings();
  }
  function renderSettings() {
    document.querySelectorAll("#modeSeg [data-tmode]").forEach(b => b.classList.toggle("on", b.dataset.tmode === theme.mode));
    const tr = document.getElementById("toneRow");
    tr.innerHTML = TONES[theme.mode].map(t =>
      `<div class="tone${theme.tone[theme.mode] === t.id ? " sel" : ""}" data-tone="${t.id}">
         <div class="sw" style="background:${t.sw}"></div><div class="tn">${t.name}</div></div>`).join("");
    tr.querySelectorAll("[data-tone]").forEach(el => el.onclick = () => { theme.tone[theme.mode] = el.dataset.tone; applyTheme(); });
    const ar = document.getElementById("accentRow");
    ar.innerHTML = ACCENTS.map(a =>
      `<div class="acc${theme.accent === a.id ? " sel" : ""}" data-acc="${a.id}">
         <span class="ring" style="background:${a[theme.mode]}"></span><span class="an">${a.name}</span></div>`).join("");
    ar.querySelectorAll("[data-acc]").forEach(el => el.onclick = () => { theme.accent = el.dataset.acc; applyTheme(); });
  }
  document.querySelectorAll("#modeSeg [data-tmode]").forEach(b => b.onclick = () => { theme.mode = b.dataset.tmode; applyTheme(); });

  // ---- display size ----
  // In Electron this is real browser zoom, so the map re-renders its tiles at
  // the new size instead of being scaled up blurry. In a plain browser (the
  // page opens there too) CSS zoom is the closest equivalent.
  const ZOOM_STEPS = [0.8, 0.9, 1, 1.1, 1.25, 1.4, 1.6, 1.8, 2];
  let uiScale = Number(store.prefs.uiScale) || 1;
  function applyScale(f, persist) {
    uiScale = Math.min(2, Math.max(0.8, Number(f) || 1));
    if (window.desktop) window.desktop.setZoom(uiScale);
    else document.documentElement.style.zoom = uiScale;
    const v = document.getElementById("sizeVal");
    if (v) v.textContent = Math.round(uiScale * 100) + "%";
    if (persist !== false) savePrefs({ uiScale });
  }
  function stepScale(dir) {
    const near = ZOOM_STEPS.reduce((best, v, n) =>
      Math.abs(v - uiScale) < Math.abs(ZOOM_STEPS[best] - uiScale) ? n : best, 0);
    applyScale(ZOOM_STEPS[Math.min(ZOOM_STEPS.length - 1, Math.max(0, near + dir))]);
  }
  document.getElementById("sizeUp").onclick = () => stepScale(+1);
  document.getElementById("sizeDown").onclick = () => stepScale(-1);
  document.getElementById("sizeReset").onclick = () => applyScale(1);
  if (window.desktop) {
    document.getElementById("sizeHint").textContent =
      "Scales the whole app, map included. Also " + (navigator.platform.startsWith("Mac") ? "\u2318" : "Ctrl")
      + "\u2212 / " + (navigator.platform.startsWith("Mac") ? "\u2318" : "Ctrl") + "=, or pinch on the trackpad.";
    window.desktop.onZoom(f => applyScale(f));   // the View menu and its shortcuts
  }

  // ---- the settings drawer ----
  const menuBtn = document.getElementById("menuBtn");
  const scrim = document.getElementById("scrim");
  let menuOpen = false;
  function openMenu() {
    menuOpen = true;
    scrim.hidden = false;
    // let the element exist for a frame so the fade actually animates
    requestAnimationFrame(() => document.body.classList.add("settings-open"));
    menuBtn.classList.add("on");
  }
  function closeMenu() {
    menuOpen = false;
    document.body.classList.remove("settings-open");
    menuBtn.classList.remove("on");
    setTimeout(() => { if (!menuOpen) scrim.hidden = true; }, 300);
  }
  menuBtn.addEventListener("click", () => (menuOpen ? closeMenu() : openMenu()));
  document.getElementById("set-close").onclick = closeMenu;
  scrim.addEventListener("click", closeMenu);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && menuOpen) closeMenu(); });

  // ---- adjustable sidebar (drag the divider; width remembered) ----
  const sidebar = document.getElementById("sidebar");
  const resizer = document.getElementById("resizer");
  const SB_MIN = 320, SB_MAX = 760;
  const savedW = parseInt(localStorage.getItem("planner-sbw") || "", 10);
  if (savedW) sidebar.style.width = Math.min(SB_MAX, Math.max(SB_MIN, savedW)) + "px";
  let dragging = false;
  resizer.addEventListener("mousedown", (e) => {
    dragging = true; resizer.classList.add("drag"); document.body.classList.add("resizing"); e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const left = document.getElementById("app").getBoundingClientRect().left;
    const w = Math.min(SB_MAX, Math.max(SB_MIN, e.clientX - left));
    sidebar.style.width = w + "px";
    map.invalidateSize();
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false; resizer.classList.remove("drag"); document.body.classList.remove("resizing");
    localStorage.setItem("planner-sbw", parseInt(sidebar.style.width, 10) || 440);
    map.invalidateSize();
  });
  // double-click divider resets to default width
  resizer.addEventListener("dblclick", () => {
    sidebar.style.width = "440px"; localStorage.setItem("planner-sbw", "440"); map.invalidateSize();
  });

  // ---- the plan panel is drag-resizable against the map (Trips view) ----
  const stageResizer = document.getElementById("stageResizer");
  const ST_MIN = 340, ST_MAX = 900;
  const savedStW = parseInt(localStorage.getItem("planner-stagew") || "", 10);
  if (savedStW) document.documentElement.style.setProperty("--stagew", Math.min(ST_MAX, Math.max(ST_MIN, savedStW)) + "px");
  let stDrag = false;
  stageResizer.addEventListener("mousedown", (e) => {
    stDrag = true; stageResizer.classList.add("drag"); document.body.classList.add("resizing"); e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!stDrag) return;
    const left = stage.getBoundingClientRect().left;
    const w = Math.min(ST_MAX, Math.max(ST_MIN, e.clientX - left));
    document.documentElement.style.setProperty("--stagew", w + "px");
    map.invalidateSize();
  });
  window.addEventListener("mouseup", () => {
    if (!stDrag) return;
    stDrag = false; stageResizer.classList.remove("drag"); document.body.classList.remove("resizing");
    localStorage.setItem("planner-stagew", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--stagew"), 10) || 460);
    map.invalidateSize();
  });
  stageResizer.addEventListener("dblclick", () => {
    document.documentElement.style.removeProperty("--stagew");
    localStorage.removeItem("planner-stagew"); map.invalidateSize();
  });

  // ---- extension hook (future: agent / external search injects places at runtime) ----
  // Usage from anywhere: window.addPlaces([{ name, cn?, lat, lng, c?, desc?, link?, src? }, ...])
  let extSeq = 1;
  window.addPlaces = function (arr) {
    if (!Array.isArray(arr)) arr = [arr];
    let n = 0;
    arr.forEach(p => {
      if (!p || !p.name || typeof p.lat !== "number" || typeof p.lng !== "number") return;
      if (!p.id) p.id = "ext-" + (extSeq++);
      if (allPlaces().some(x => x.id === p.id)) return;
      p.c = p.c || "custom";
      assignDistrict(p); PLACES.push(p); addMarker(p); n++;
    });
    if (n) { refreshMarkers(); renderList(); showHint(n + " place" + (n === 1 ? "" : "s") + " added to the map"); }
    return n;
  };

  // The one-time localStorage patch functions that used to live here are gone.
  // Their job — seeding the reference trip and correcting it in place — now
  // belongs to backend/scripts/seed.js and the legacy import.

  // ------------------------------------------------------------------ go
  try { COMMUTE_KINDS = await Repo.commuteKinds(); }
  catch (e) { console.warn("[boot] commute kinds unavailable:", e.message); }
  // Scope the area tabs to the country you're opening in — with three countries
  // and 44 areas, an unscoped tab strip is unusable.
  const firstArea = openingArea();
  ui.country = countryOf(firstArea);
  buildDistrictOptions();
  buildCountryOptions();
  buildCityTabs();
  setCity(firstArea);
  applyTheme();
  applyScale(uiScale, false);   // already saved — don't write it straight back
  nav("map");
  // Every trip's server state is the baseline, so an untouched trip is never re-pushed.
  store.trips.forEach(t => {
    lastPushed[t.id] = JSON.stringify(PlannerAPI.toPlanDoc(t)) + "|" + t.name + t.start + t.end;
  });
  if (BOOT.imported) {
    const i = BOOT.imported;
    showHint(`Moved your saved data into the database — ${i.trips} trip, ${i.items} places, ${i.hotels} hotels, ${i.marks} marks`);
  } else {
    const n = store.trips.length;
    showHint(n ? `${n} trip${n > 1 ? "s" : ""} loaded from the database` : "No trips yet — create one to start");
  }
  })();
  </script>
</body>
</html>
